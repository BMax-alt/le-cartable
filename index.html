      if (s.streak > 0 && s.streak % 5 === 0) toast(pick([`Bravo ${user}, ${s.streak} de suite !`, `Quelle série, ${user} ! ${s.streak} d'affilée !`, `Tu es en feu, ${user} ! ${s.streak} de suite !`]));
      else if (v === 2 && s.round === 1 && s.order.filter(i => s.grade[i] != null).length === Math.ceil(s.order.length / 2)) toast(`La moitié de la leçon, ${user} ! Continue comme ça.`);
    }
    // Carte suivante pas encore notée dans ce tour ; sinon fin du tour.
    const n = s.order.length;
    for (let k = 1; k <= n; k++) {
      const p = (s.pos + k) % n;
      if (s.grade[s.order[p]] == null) {
        const avant = s.deck.cartes[idx].groupe, apres = s.deck.cartes[s.order[p]].groupe;
        const fin = s.deck.bilan && s.round === 1 && p > s.pos && avant !== apres;
        s.pos = p;
        return fin ? stopGroupe(avant, false, () => card(s)) : card(s);
      }
    }
    if (s.deck.bilan && s.round === 1 && !s.finDite) { s.finDite = true; return stopGroupe(s.deck.cartes[idx].groupe, true, () => endRound(s)); }
    endRound(s);
  }

  // Dictée bilan : « Stop ! Le groupe jaune est terminé », dit et affiché, avant de passer au groupe suivant.
  function stopGroupe(groupe, derniere, suite) {
    const txt = `Stop ! Le groupe ${groupe} est terminé.` + (derniere ? " La dictée est finie." : "");
    app.innerHTML = `<div class="view end stop">
      <div class="medal" aria-hidden="true">✋</div>
      <h2>Stop ! Le groupe ${esc(groupe)} est terminé.</h2>
      ${derniere ? '<p class="sub">La dictée est finie.</p>' : '<p class="sub">On passe au groupe suivant.</p>'}
      <div class="actions"><button class="big g" id="suite">${derniere ? "Voir mon résultat" : "Continuer"}</button></div>
    </div>`;
    voice.say([txt]);
    document.getElementById("suite").onclick = () => { voice.stop(); suite(); };
  }
  // Dictée bilan : on choisit jusqu'où on va. Les groupes s'ajoutent : jaune, puis vert, puis violet.
  function choixBilan(deck) {
    const ordre = ["jaune", "vert", "violet"].filter(g => deck.cartes.some(c => c.groupe === g));
    const choix = ordre.map((g, k) => ordre.slice(0, k + 1));
    const nom = l => l.map(g => g[0].toUpperCase() + g.slice(1)).join(" + ");
    app.innerHTML = `<div class="view end">
      <h2>${esc(deck.titre)}</h2>
      <p class="sub">Jusqu'où tu vas aujourd'hui, ${esc(user)} ?</p>
      <div class="choixbilan">${choix.map((l, k) => `<button class="big ${k === choix.length - 1 ? "g" : "reveal"}" data-k="${k}">${esc(nom(l))}</button>`).join("")}
        <button class="big retry" id="annuler">Retour</button></div>
    </div>`;
    app.querySelectorAll(".choixbilan [data-k]").forEach(b => b.onclick = () => {
      const l = choix[+b.dataset.k];
      start(deck, deck.cartes.map((c, i) => l.includes(c.groupe) ? i : -1).filter(i => i >= 0));
    });
    document.getElementById("annuler").onclick = back;
  }

  function endRound(s) {
    const left = s.order.filter(i => s.grade[i] !== 2);
    if (!left.length) return end(s);
    app.innerHTML = `<div class="view end">
      <h2>Tour ${s.round} terminé !</h2>
      <p class="score">Encore <b>${left.length}</b> ${left.length > 1 ? "cartes" : "carte"} à revoir, ${esc(user)}. On les refait ?</p>
      <div class="actions"><button class="big reveal" id="goon">On y va !</button><button class="big m" id="stop">Plus tard</button></div>
    </div>`;
    document.getElementById("goon").onclick = () => { s.round++; newRound(s, left); persist(s); card(s); };
    // « Plus tard » : le tour suivant est prêt, on le reprendra depuis l'accueil.
    document.getElementById("stop").onclick = () => { s.round++; newRound(s, left); persist(s); back(); };
  }

  function saveScore(s) {
    const firstOk = Object.keys(s.first).filter(i => s.first[i] === 2).length;
    if (!s.partial) store.set("deck:" + user + ":" + s.deck.id, { first: firstOk, total: s.total, date: new Date().toISOString().slice(0, 10) });
    s.seance.fin = new Date().toISOString(); s.seance.tours = s.round; s.seance.premierCoup = firstOk;
    if (!s.partial) s.seance.complet = true;
    delete s.seance.etat; store.set(inkKey(s.seance), null);
    saveSeance(user, s.seance); syncNow();
    return firstOk;
  }

  function end(s) {
    letSleep();
    const firstOk = saveScore(s);
    const hard = Object.keys(s.first).filter(i => s.first[i] !== 2).map(Number);
    const title = firstOk === s.total
      ? pick([`Bravo ${user}, tu sais ta leçon par cœur !`, `Parfait, ${user} ! Tout juste du premier coup !`])
      : pick([`Bravo ${user}, tu sais ta leçon !`, `Bravo ${user}, tu as réussi !`]);
    const sub = firstOk === s.total ? "Pas une seule erreur. Chapeau !"
      : s.round > 1 ? `Tu as tout revu en ${s.round} tours. C'est comme ça qu'on apprend !`
      : "Tu as tout revu jusqu'au bout. Bien joué !";
    app.innerHTML = `<div class="view end">
      <div class="medal" aria-hidden="true">★</div>
      <h2>${esc(title)}</h2>
      <p class="sub">${sub}</p>
      <p class="score"><b>${firstOk}</b> sur ${s.total} du premier coup.</p>
      ${hard.length ? `<p class="hint">Les cartes qui t'ont demandé un effort :</p><ul class="review">${hard.map(i => { const k = s.deck.cartes[i]; return `<li><span>${esc(s.deck.bilan ? k.phrase : s.deck.dictee ? k.mot : k.op ? k.nombres.join(" " + k.op + " ") : k.q)}</span></li>`; }).join("")}</ul>` : ""}
      <div class="actions">
        ${hard.length ? '<button class="big m" id="hard">Revoir ces cartes</button>' : ""}
        <button class="big g" id="again">Tout recommencer</button>
        <button class="big reveal" id="home">Mes leçons</button>
      </div>
    </div>`;
    confetti();
    document.getElementById("again").onclick = () => s.deck.bilan ? choixBilan(s.deck) : start(s.deck, s.deck.cartes.map((_, i) => i));
    document.getElementById("home").onclick = back;
    if (hard.length) document.getElementById("hard").onclick = () => start(s.deck, hard);
  }

  /* ---------- Zone d'écriture au crayon ---------- */
  // Figure attendue dans la réponse (perspective cavalière…) : segments en carreaux, y vers le bas.
  // figure: { traits: [[x1, y1, x2, y2], …], pointilles: [[…], …] } — dessinée sur un fond de carreaux.
  function figureHtml(f) {
    const tous = [...(f.traits || []), ...(f.pointilles || [])];
    if (!tous.length) return "";
    const xs = tous.flatMap(s => [s[0], s[2]]), ys = tous.flatMap(s => [s[1], s[3]]);
    const x0 = Math.min(...xs) - 1, y0 = Math.min(...ys) - 1, W = Math.max(...xs) + 1 - x0, H = Math.max(...ys) + 1 - y0, K = 28;
    let grille = "";
    for (let i = 0; i <= W; i++) grille += `<line x1="${i * K}" y1="0" x2="${i * K}" y2="${H * K}" class="g"/>`;
    for (let j = 0; j <= H; j++) grille += `<line x1="0" y1="${j * K}" x2="${W * K}" y2="${j * K}" class="g"/>`;
    const seg = (s, cl) => `<line x1="${(s[0] - x0) * K}" y1="${(s[1] - y0) * K}" x2="${(s[2] - x0) * K}" y2="${(s[3] - y0) * K}" class="${cl}"/>`;
    return `<svg class="figure" viewBox="0 0 ${W * K} ${H * K}" width="${W * K}" height="${H * K}" role="img" aria-label="La figure attendue">${grille}
      ${(f.traits || []).map(s => seg(s, "t")).join("")}${(f.pointilles || []).map(s => seg(s, "p")).join("")}</svg>`;
  }

  /* ---------- Dessin géométrique : traits droits aimantés et équerre ---------- */
  // « Traits droits » : un trait tracé à main levée devient un segment net. Ses deux bouts sont aimantés
  // sur les lignes de la feuille Seyès (tous les 12 px, un quart de carreau) ou sur le bout d'un segment déjà tracé,
  // et sa direction sur l'horizontale, la verticale ou la diagonale (45°) quand elle en est proche.
  // Les longueurs tombent donc pile sur les carreaux : pas d'à-peu-près. Un tracé courbe (écriture) reste tel quel.
  // « Équerre » : une équerre posée sur la feuille, qu'on déplace (poignée du milieu) et qu'on tourne (poignée du bout),
  // aimantée sur les carreaux et sur les angles ronds. Un trait tiré le long d'un bord se colle à ce bord.
  const CARREAU = 12, X0 = 65, Y0 = 47; // repères du fond Seyès de .sheet : X0 = 1re ligne verticale, Y0 = 1re grosse ligne horizontale
  // Aimant de la grille : les coins des grands carreaux (48 px), là où se croisent les lignes principales
  // (Ben, 10/11 : « les traits ne commencent pas sur les lignes principales »). Un crayon qui dépasse revient pile sur le carreau.
  const PAS = 4 * CARREAU, AIMANT_COIN = 20;
  const noeud = p => ({ x: X0 + Math.round((p.x - X0) / PAS) * PAS, y: Y0 + Math.round((p.y - Y0) / PAS) * PAS });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function bouts(strokes) { const l = []; for (const st of strokes) if (st.length === 2) l.push(st[0], st[1]); return l; }
  function aimant(p, strokes) {
    let best = null, d = AIMANT_COIN; // un coin déjà tracé attire plus fort que la grille
    for (const q of bouts(strokes)) { const e = dist(p, q); if (e < d) { d = e; best = q; } }
    return best ? { x: best.x, y: best.y } : noeud(p);
  }
  function estDroit(pts) {
    const a = pts[0], b = pts[pts.length - 1], L = dist(a, b);
    if (L < 18) return false;
    let dev = 0;
    for (const p of pts) dev = Math.max(dev, Math.abs((b.x - a.x) * (a.y - p.y) - (a.x - p.x) * (b.y - a.y)) / L);
    return dev <= Math.max(6, 0.12 * L);
  }
  // Redresse un trait : renvoie [début, fin] aimantés, ou null si le tracé n'est pas droit.
  function redresser(pts, strokes, eq) {
    if (!estDroit(pts)) return null;
    const a = pts[0], b = pts[pts.length - 1], pr = (a.p + b.p) / 2;
    // Le long d'un bord de l'équerre ?
    if (eq) for (const [u, v] of eq.bords()) {
      const dx = v.x - u.x, dy = v.y - u.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const ecart = p => Math.abs((p.x - u.x) * uy - (p.y - u.y) * ux);
      if (ecart(a) > 16 || ecart(b) > 16) continue;
      const t = p => (p.x - u.x) * ux + (p.y - u.y) * uy;
      // Départ sur une graduation de l'équerre (un carreau), ou sur le bout d'un segment déjà posé sur ce bord.
      const ta = Math.round(Math.max(0, Math.min(L, t(a))) / PAS) * PAS, tb = Math.max(0, Math.min(L, t(b)));
      let s = { x: u.x + ux * ta, y: u.y + uy * ta };
      for (const q of bouts(strokes)) if (dist(q, s) < AIMANT_COIN && ecart(q) < 1) { s = { x: q.x, y: q.y }; break; }
      const k = Math.max(1, Math.round(Math.abs(tb - ta) / PAS)) * Math.sign(tb - ta || 1);
      let e = { x: s.x + ux * k * PAS, y: s.y + uy * k * PAS };
      for (const q of bouts(strokes)) if (dist(q, b) < AIMANT_COIN && ecart(q) < 1 && dist(q, s) > 1) { e = { x: q.x, y: q.y }; break; }
      return [{ ...s, p: pr }, { ...e, p: pr }];
    }
    const s = aimant(a, strokes);
    const dx = b.x - s.x, dy = b.y - s.y, ang = Math.atan2(dy, dx), cran = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
    let e;
    if (Math.abs(ang - cran) < 8 * Math.PI / 180) {
      const ux = Math.round(Math.cos(cran)), uy = Math.round(Math.sin(cran)); // pas d'un demi-carreau en x et/ou en y
      const pas = Math.hypot(ux, uy) * PAS;
      const k = Math.max(1, Math.round(Math.hypot(dx, dy) / pas));
      e = { x: s.x + ux * k * PAS, y: s.y + uy * k * PAS };
      // Un coin déjà tracé dans cette direction, près de là où le crayon s'arrête : on s'y arrête pile.
      let best = null, d = AIMANT_COIN;
      for (const q of bouts(strokes)) {
        const vx = q.x - s.x, vy = q.y - s.y, L = Math.hypot(vx, vy);
        if (L < 1 || Math.abs(vx * uy - vy * ux) / Math.hypot(ux, uy) > 1 || vx * ux + vy * uy <= 0) continue;
        const ecart = dist(q, b); if (ecart < d) { d = ecart; best = q; }
      }
      if (best) e = { x: best.x, y: best.y };
    } else e = aimant(b, strokes);
    if (e.x === s.x && e.y === s.y) return null;
    return [{ ...s, p: pr }, { ...e, p: pr }];
  }
  // L'équerre : triangle rectangle isocèle, angle droit à l'origine, côtés de 18 carreaux, graduée tous les carreaux.
  function equerre(sheet, etat) {
    const L = 18 * CARREAU, NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "equerre"); svg.setAttribute("width", L); svg.setAttribute("height", L);
    let grads = ""; for (let i = 1; i < 18; i++) { const g = i % 4 ? 6 : 12; grads += `<line class="grad" x1="${i * CARREAU}" y1="0" x2="${i * CARREAU}" y2="${g}"/><line class="grad" x1="0" y1="${i * CARREAU}" x2="${g}" y2="${i * CARREAU}"/>`; }
    svg.innerHTML = `<polygon class="corps" points="0,0 ${L},0 0,${L}"/>${grads}
      <circle class="poignee" data-r="move" cx="${L * 0.3}" cy="${L * 0.3}" r="22"/><text class="picto" x="${L * 0.3}" y="${L * 0.3 + 6}" text-anchor="middle">✥</text>
      <circle class="poignee" data-r="turn" cx="${L - 34}" cy="16" r="18"/><text class="picto" x="${L - 34}" y="${16 + 6}" text-anchor="middle">⟳</text>`;
    sheet.querySelector("canvas").after(svg); // sous les boutons et sous la réponse
    const place = () => { svg.style.transform = `translate(${etat.x}px, ${etat.y}px) rotate(${etat.a}deg)`; };
    const pos = e => { const r = sheet.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    svg.querySelectorAll(".poignee").forEach(h => {
      let start = null;
      h.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); try { h.setPointerCapture(e.pointerId); } catch (err) {} start = { p: pos(e), x: etat.x, y: etat.y }; });
      h.addEventListener("pointermove", e => {
        if (!start) return; e.preventDefault();
        const p = pos(e);
        if (h.dataset.r === "move") {
          const n = { x: start.x + p.x - start.p.x, y: start.y + p.y - start.p.y }, k = noeud(n);
          Object.assign(etat, dist(n, k) < 8 ? k : n); // le coin se pose sur un carreau
        } else {
          let a = Math.atan2(p.y - etat.y, p.x - etat.x) * 180 / Math.PI - Math.atan2(16, L - 34) * 180 / Math.PI;
          const r = Math.round(a / 15) * 15; if (Math.abs(a - r) < 4) a = r; // angles ronds : 0, 15, 30, 45, 90…
          etat.a = a;
        }
        place();
      });
      const fin = () => { start = null; };
      h.addEventListener("pointerup", fin); h.addEventListener("pointercancel", fin);
      ["touchstart", "touchmove"].forEach(t => h.addEventListener(t, ev => ev.cancelable && ev.preventDefault(), { passive: false }));
    });
    place();
    return {
      el: svg,
      bords() {
        const c = Math.cos(etat.a * Math.PI / 180), s = Math.sin(etat.a * Math.PI / 180);
        const P = (x, y) => ({ x: etat.x + x * c - y * s, y: etat.y + x * s + y * c });
        const O = P(0, 0), A = P(L, 0), B = P(0, L);
        return [[O, A], [O, B], [A, B]];
      }
    };
  }

  // Outils de géométrie (traits droits, pointillés, équerre, gomme) : seulement sur un paquet de dessin (Ben, 10/11 : « que sur la géométrie »).
  function geo(deck) { return !!(deck.dessin || deck.cartes.some(c => c.dessin)); }
  // outils = { droit, equerre, eq: {x, y, a} } : gardé pour toute la séance (s.outils).
  function drawPad(cv, ph, strokes, outils) {
    const ctx = cv.getContext("2d");
    const sheet = cv.parentElement, tools = sheet.querySelector(".tools");
    let eq = null;
    sheet.classList.toggle("geo", !!outils);
    if (outils && tools) {
      const bD = document.createElement("button"), bP = document.createElement("button"), bE = document.createElement("button"), bG = document.createElement("button");
      bD.className = bP.className = bE.className = bG.className = "tool"; bD.textContent = "Traits droits"; bP.textContent = "Pointillés"; bE.textContent = "Équerre"; bG.textContent = "Gomme";
      const maj = () => {
        bD.classList.toggle("on", !!outils.droit); bP.classList.toggle("on", !!outils.pointilles); bE.classList.toggle("on", !!outils.equerre); bG.classList.toggle("on", !!outils.gomme);
        if (outils.equerre && !eq) { outils.eq ||= { x: X0 + PAS, y: Y0 + 2 * PAS, a: 0 }; eq = equerre(sheet, outils.eq); }
        if (!outils.equerre && eq) { eq.el.remove(); eq = null; }
      };
      bD.onclick = () => { outils.droit = !outils.droit; maj(); };
      bP.onclick = () => { outils.pointilles = !outils.pointilles; maj(); };
      bE.onclick = () => { outils.equerre = !outils.equerre; maj(); };
      bG.onclick = () => { outils.gomme = !outils.gomme; maj(); };
      tools.prepend(bD, bP, bE, bG);
      maj();
    }
    let current = null, penSeen = false, w = 0, h = 0, rect = null;
    const ink = getComputedStyle(document.documentElement).getPropertyValue("--pen").trim() || "#1f3fa6";

    function size() {
      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      w = r.width; h = r.height;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    function seg(a, b) {
      ctx.lineWidth = 1.2 + 3.2 * ((a.p + b.p) / 2);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    function redraw() {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = ink; ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (const st of strokes) {
        // Trait en pointillés (arêtes cachées) : repéré par d sur son premier point, tracé d'un seul chemin.
        if (st[0]?.d && st.length > 1) {
          ctx.save(); ctx.setLineDash([7, 6]); ctx.lineCap = "butt";
          ctx.lineWidth = 1.2 + 3.2 * (st.reduce((m, q) => m + q.p, 0) / st.length);
          ctx.beginPath(); ctx.moveTo(st[0].x, st[0].y); for (const q of st.slice(1)) ctx.lineTo(q.x, q.y); ctx.stroke();
          ctx.restore(); continue;
        }
        if (st.length === 1) { ctx.beginPath(); ctx.arc(st[0].x, st[0].y, 1.6, 0, 7); ctx.fillStyle = ink; ctx.fill(); }
        for (let i = 1; i < st.length; i++) seg(st[i - 1], st[i]);
      }
      ph.style.opacity = strokes.length ? 0 : "";
    }
    const pt = e => { const r = rect || cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === "pen" ? (e.pressure || 0.5) : 0.5 }; };
    const allowed = e => { if (e.pointerType === "pen") penSeen = true; return !(penSeen && e.pointerType === "touch"); };

    // Gomme : chaque trait touché s'efface en entier (on le refait ensuite proprement).
    let gommer = false;
    const prochePt = (p, a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy; const u = L2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2)) : 0; return Math.hypot(p.x - a.x - u * dx, p.y - a.y - u * dy); };
    const gommeEn = p => {
      let n = strokes.length;
      for (let i = strokes.length - 1; i >= 0; i--) { const st = strokes[i];
        const touche = st.length === 1 ? dist(p, st[0]) < 10 : st.some((q, k) => k > 0 && prochePt(p, st[k - 1], q) < 10);
        if (touche) strokes.splice(i, 1); }
      if (strokes.length !== n) redraw();
    };
    cv.addEventListener("pointerdown", e => {
      if (!allowed(e)) return;
      e.preventDefault(); rect = cv.getBoundingClientRect();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      if (outils?.gomme) { gommer = true; gommeEn(pt(e)); return; }
      current = [pt(e)]; if (outils?.pointilles) current[0].d = 1; strokes.push(current); redraw();
    });
    cv.addEventListener("pointermove", e => {
      if (gommer && allowed(e)) { e.preventDefault(); (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(ce => gommeEn(pt(ce))); return; }
      if (!current || !allowed(e)) return;
      e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      ctx.strokeStyle = ink; ctx.lineCap = "round";
      for (const ce of evs) { const p = pt(ce); seg(current[current.length - 1], p); current.push(p); }
    });
    const up = () => {
      gommer = false;
      if (current && outils?.droit && current.length > 1) {
        const net = redresser(current, strokes.slice(0, -1), eq);
        if (net) { if (current[0].d) net[0].d = 1; current.length = 0; current.push(...net); }
      }
      if (current) redraw(); // trait redressé ou pointillés : on le redessine propre
      current = null;
    };
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    // Safari iPad : sans ça, le trait du Pencil est pris pour un défilement ou une sélection et se coupe.
    const block = e => { if (e.cancelable) e.preventDefault(); };
    ["touchstart", "touchmove", "touchend"].forEach(t => cv.addEventListener(t, block, { passive: false }));
    cv.addEventListener("contextmenu", block);
    const ro = new ResizeObserver(size); ro.observe(cv);
    size();

      undo() { strokes.pop(); redraw(); },
      clear() { strokes.length = 0; redraw(); },
      stop() { ro.disconnect(); },
      redresser: pts => redresser(pts, strokes, eq) // pour les tests
    };
  }

  /* ---------- Pause toutes les 20 minutes (Ben, 10/11) ---------- */
  // Le temps compte seulement quand une leçon est ouverte à l'écran (bouton « Mes leçons » présent) et que l'app est visible.
  // À 20 minutes, l'app propose une pause ; « Rappelle-moi dans 5 minutes » repousse la question de 5 minutes de travail.
  // Plus de 10 minutes hors leçon (app fermée, accueil) : c'est déjà une pause, le compteur repart de zéro.
  const PAUSE_APRES = 20 * 60, PAUSE_REPORT = 5 * 60, PAUSE_DEJA_FAITE = 10 * 60 * 1000;
  const pauseKey = () => "pause:" + (user || "");
  let pauseVue = null;
  function pauseTick() {
    if (!user || pauseVue) return;
    const now = Date.now();
    const p = store.get(pauseKey()) || { travail: 0, seuil: PAUSE_APRES, vu: now };
    if (now - p.vu > PAUSE_DEJA_FAITE) { p.travail = 0; p.seuil = PAUSE_APRES; }
    const enLecon = document.visibilityState === "visible" && document.getElementById("quit");
    if (enLecon) p.travail += Math.min(30, Math.round((now - p.vu) / 1000));
    if (enLecon) p.vu = now;
    else if (now - p.vu > PAUSE_DEJA_FAITE) p.vu = now;
    store.set(pauseKey(), p);
    if (enLecon && p.travail >= p.seuil) proposerPause(p);
  }
  function proposerPause(p) {
    const el = document.createElement("div"); el.className = "pause"; pauseVue = el;
    el.innerHTML = `<div class="boite" role="dialog" aria-modal="true">
      <h2>Et si tu faisais une pause, ${esc(user)} ?</h2>
      <p>Ça fait ${Math.round(p.travail / 60)} minutes que tu travailles. Lève-toi, bois un peu d'eau, bouge un peu.</p>
      <div class="btns"><button class="big g" id="pauseOui">Je fais une pause</button><button class="big retry" id="pauseNon">Rappelle-moi dans 5 minutes</button></div></div>`;
    document.body.append(el);
    const fermer = () => { el.remove(); pauseVue = null; };
    el.querySelector("#pauseNon").onclick = () => { p.seuil = p.travail + PAUSE_REPORT; p.vu = Date.now(); store.set(pauseKey(), p); fermer(); };
    el.querySelector("#pauseOui").onclick = () => {
      const debut = Date.now();
      const boite = el.querySelector(".boite");
      boite.innerHTML = `<h2>C'est la pause !</h2><p id="pauseMsg">Ça sonnera dans 5 minutes.</p><div class="chrono" id="pauseChrono">0:00</div>
        <div class="btns"><button class="big g" id="pauseFin">Je reprends</button></div>`;
      // Sonnerie au bout de 5 minutes (Ben, 11/11). Le son se prépare pendant le toucher « Je fais une pause » (exigence de l'iPad),
      // et l'écran reste allumé pendant la pause : un iPad en veille ne sonnerait pas.
      const son = sonnerieLancer();
      let wake = null; try { navigator.wakeLock?.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {}
      let sonne = false;
      const chrono = setInterval(() => {
        const s = Math.floor((Date.now() - debut) / 1000); const c = document.getElementById("pauseChrono"); if (c) c.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        if (!sonne && s >= PAUSE_DUREE) { sonne = true; son.jouer(); const m = document.getElementById("pauseMsg"); if (m) m.textContent = "La pause est finie, on reprend !"; }
      }, 1000);
      boite.querySelector("#pauseFin").onclick = () => { clearInterval(chrono); son.fermer(); try { wake?.release(); } catch (e) {} store.set(pauseKey(), { travail: 0, seuil: PAUSE_APRES, vu: Date.now() }); fermer(); };
    };
  }
  const PAUSE_DUREE = 5 * 60;
  // Sonnerie douce : trois fois deux notes de cloche, produites par l'iPad (aucun fichier son).
  function sonnerieLancer() {
    let ctx = null;
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback"; // sonne même en mode silencieux
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); // déverrouille le son
    } catch (e) { ctx = null; }
    const note = (freq, t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.start(t); o.stop(t + 1.3);
    };
    return {
      jouer() {
        if (!ctx) return;
        try { ctx.resume?.(); const t0 = ctx.currentTime + 0.05; for (let i = 0; i < 3; i++) { note(880, t0 + i * 1.6); note(660, t0 + i * 1.6 + 0.4); } } catch (e) {}
      },
      fermer() { try { ctx?.close(); } catch (e) {} }
    };
  }
  setInterval(pauseTick, 15000);
  document.addEventListener("visibilitychange", pauseTick);

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && document.querySelector(".sheet")) keepAwake(); });
  // Pas de zoom : ni double tape, ni pincement (Ben, 10/11)
  ["gesturestart","gesturechange","gestureend"].forEach(e => document.addEventListener(e, ev => ev.preventDefault(), { passive: false }));
  // Mise à jour automatique : l'app de l'écran d'accueil reste en mémoire et garderait l'ancienne version.
  // À l'ouverture et à chaque retour dans l'app, on compare avec la version en ligne et on recharge si elle a changé,
  // seulement hors séance (pas au milieu d'une carte).
  const VERSION = "2026-11-11-a";
  async function verifierVersion() {
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      const m = (await r.text()).match(/const VERSION = "([^"]+)"/);
      if (m && m[1] !== VERSION) {
        if (document.querySelector(".sheet, .choices")) { store.set("majEnAttente", true); return; }
        location.reload();
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verifierVersion(); });
  verifierVersion();
  // Démarrage : sans clé, on va aux Réglages. Sinon on affiche tout de suite les paquets gardés sur l'iPad,
  // puis on va chercher la dernière version dans le coffre.
  if (!token()) return settings();
  // Premier lancement après la mise à jour : on attend la liste des élèves (et leur niveau) avant d'afficher.
  if (eleves().length) { accueil(); loadEleves().then(() => { if (document.getElementById("newuser")) who(); }).catch(() => {}); }
  else { app.innerHTML = '<div class="view who"><p class="hint">Chargement…</p></div>'; within(loadEleves().catch(() => {}), 8000).then(() => accueil()); }
  within(loadEleves().catch(() => {}), 8000).then(() => pullProgress()).then(() => { if (document.querySelector(".home")) back(); });
  loadDecks().then(() => { prechargerCours(); if (document.querySelector(".home")) retour == null && !surSemaine ? accueil() : back(); }).catch(e => { if (!DECKS.length) settings("Impossible de lire le coffre (" + e.message + ")."); });
  syncNow();
};
</script>
<script>window.__boot();</script>
<script>
// Ouverture sans réseau : la page et ses fichiers sont gardés sur l'appareil (sw.js), la version en ligne passe toujours d'abord.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
