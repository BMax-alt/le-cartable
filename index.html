<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Le Cartable">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Le Cartable</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Un cahier d'écolier : page Seyès plein écran pour écrire, cartes posées dessus comme des étiquettes. Monde unique et clair, volontairement. */
:root {
  color-scheme: light;
  --paper: #fbfcff;
  --desk: #e9eef7;
  --ink: #1d2b4f;
  --pen: #1f3fa6;
  --seyes-thin: #c9d6f2;
  --seyes-thick: #9fb3e3;
  --margin-red: #e2696b;
  --accent: #f2b632;
  --accent-ink: #4a3300;
  --muted: #5c6a8a;
  --good: #2f9a5d;
  --mid: #e08a1e;
  --bad: #d4484b;
  --label: #fff6d9;
  --line: #d5dcec;
  --display: "Grandstander", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  --body: "Andika", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  gap: 12px;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* Accueil */
.home { overflow-y: auto; gap: 28px; padding-block: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 6vw, 56px); margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); }
.matiere h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.deck {
  text-align: left; background: var(--paper); border-radius: 14px; padding: 20px 20px 18px 34px;
  box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(29,43,79,.08);
  position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 140px;
}
.deck::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: var(--margin-red); opacity: .7; }
.deck strong { font-family: var(--display); font-size: 24px; font-weight: 800; line-height: 1.15; }
.deck .meta { color: var(--muted); font-size: 16px; margin-top: auto; }
.tag { align-self: flex-start; background: var(--label); color: var(--accent-ink); font-size: 14px; padding: 2px 10px; border-radius: 99px; border: 1px dashed var(--accent); }
.hint { color: var(--muted); font-size: 16px; max-width: 60ch; line-height: 1.5; }
/* Semaine : ce qu'il faut savoir pour chaque jour de la fiche */
.week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.day { background: var(--paper); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(29,43,79,.08); border: 3px solid transparent; min-width: 0; }
.day b { font-family: var(--display); font-weight: 800; font-size: clamp(18px, 3vw, 26px); }
.day small { font-size: 13px; color: var(--muted); text-align: center; }
.day .n { font-size: 15px; }
.day.today { border-color: var(--accent); }
.day.done { border-color: var(--good); }
.day.done .n { color: var(--good); font-weight: 700; }
.day.empty { opacity: .45; box-shadow: none; }
.day.past { opacity: .55; }
.deck.done { box-shadow: 0 0 0 3px var(--good), 0 6px 18px rgba(29,43,79,.08); }
.deck .fait { color: var(--good); font-weight: 700; font-size: 16px; }
.deck .pour { font-size: 15px; color: var(--muted); }
.archives-btn { min-height: 0; align-self: flex-start; width: min(420px, 100%); }
.serie { grid-column: 1 / -1; font-family: var(--display); font-weight: 600; font-size: 20px; margin: 6px 0 -4px; }
.tag.eval { border-style: solid; }

/* Séance */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { font-size: 17px; padding: 10px 14px; border-radius: 10px; background: var(--paper); box-shadow: 0 1px 0 var(--line); }
.progress { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 4px; }
.progress .txt { font-size: 15px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.bar { height: 10px; background: var(--paper); border-radius: 99px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.question {
  background: var(--label); border-radius: 14px; padding: 18px 22px;
  box-shadow: 0 2px 0 #eadba8; display: flex; flex-direction: column; gap: 6px;
}
.question small { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); opacity: .75; }
.question p { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(22px, 3.2vw, 32px); line-height: 1.25; text-wrap: balance; }
.sheet {
  flex: 1; min-height: 200px; position: relative; border-radius: 14px; overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 63px, var(--margin-red) 63px, var(--margin-red) 65px, transparent 65px),
    linear-gradient(90deg, var(--seyes-thin) 1px, transparent 1px),
    linear-gradient(var(--seyes-thick) 1.5px, transparent 1.5px),
    linear-gradient(var(--seyes-thin) 1px, transparent 1px);
  background-size: 100% 100%, 48px 100%, 100% 48px, 100% 12px;
  background-position: 0 0, 65px 0, 0 47px, 0 11px;
  box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(29,43,79,.08);
}
.sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.sheet .placeholder { position: absolute; left: 84px; top: 58px; color: var(--muted); opacity: .55; font-size: 20px; pointer-events: none; transition: opacity .2s; }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; }
.tool { background: rgba(255,255,255,.92); border-radius: 10px; padding: 8px 14px; font-size: 16px; box-shadow: 0 1px 0 var(--line), 0 2px 8px rgba(29,43,79,.1); }
.answer {
  position: absolute; left: 12px; right: 12px; bottom: 12px; max-height: 55%; overflow-y: auto;
  background: #ffffff; border-radius: 14px; padding: 18px 22px; border: 2px solid var(--good);
  box-shadow: 0 8px 28px rgba(29,43,79,.18); display: flex; flex-direction: column; gap: 10px;
  user-select: text; -webkit-user-select: text;
}
.answer small { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--good); font-weight: 700; }
.answer .r { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 3vw, 30px); margin: 0; line-height: 1.25; }
.answer ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.answer li button { display: flex; gap: 12px; align-items: flex-start; text-align: left; font-size: 19px; line-height: 1.35; padding: 4px 0; width: 100%; }
.answer li .box { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 700; color: #fff; margin-top: 1px; }
.answer li.on .box { background: var(--good); border-color: var(--good); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; padding-bottom: env(safe-area-inset-bottom, 0px); }
.big {
  flex: 1; min-width: 150px; min-height: 64px; border-radius: 14px; font-family: var(--display); font-weight: 800; font-size: 22px;
  box-shadow: 0 4px 0 rgba(0,0,0,.18); transition: transform .08s;
}
.big:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.reveal { background: var(--accent); color: var(--accent-ink); }
.g { background: var(--good); color: #fff; }
.m { background: var(--mid); color: #fff; }
.b { background: var(--bad); color: #fff; }

/* Fin */
.end { overflow-y: auto; align-items: center; justify-content: center; text-align: center; gap: 20px; padding-block: 24px; }
.end h2 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 54px); margin: 0; }
.score { font-size: 22px; margin: 0; }
.score b { font-family: var(--display); font-size: 1.4em; color: var(--good); font-variant-numeric: tabular-nums; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 640px; width: 100%; text-align: left; }
.review li { background: var(--paper); border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; gap: 12px; box-shadow: 0 1px 0 var(--line); }
.review li span:last-child { color: var(--muted); white-space: nowrap; font-size: 16px; }
.end .actions { justify-content: center; max-width: 720px; width: 100%; }

/* Entrée par prénom */
.who { overflow-y: auto; gap: 28px; padding-block: 24px; max-width: 760px; width: 100%; margin: 0 auto; }
.ask { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 4vw, 36px); margin: 0; }
.users { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.user { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 14px; padding: 16px 18px; font-family: var(--display); font-weight: 800; font-size: 26px; text-align: left; box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(29,43,79,.08); }
.initial { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 26px; }
.newuser { display: flex; flex-direction: column; gap: 10px; }
.newuser label { color: var(--muted); font-size: 18px; }
.newuser .row { display: flex; gap: 12px; flex-wrap: wrap; }
.newuser input { flex: 1; min-width: 200px; min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); padding: 0 18px; font-family: var(--display); font-size: 26px; color: var(--ink); -webkit-user-select: text; user-select: text; }
.newuser input:focus { outline: none; border-color: var(--pen); }
.newuser .big { flex: 0 1 220px; }
.brand { justify-content: space-between; }
/* Navigation */
.dots { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
.dots::-webkit-scrollbar { display: none; }
.dot { flex: none; min-width: 34px; height: 34px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.dot.ok { background: var(--good); box-shadow: none; color: #fff; }
.dot.mid { background: var(--mid); box-shadow: none; color: #fff; }
.dot.bad { background: var(--bad); box-shadow: none; color: #fff; }
.dot.cur { box-shadow: 0 0 0 3px var(--pen); color: var(--ink); font-weight: 700; }
.dot.cur.ok, .dot.cur.mid, .dot.cur.bad { color: #fff; }
.actions { align-items: stretch; }
.actions .main { flex: 1; display: flex; gap: 12px; flex-wrap: wrap; min-width: 0; }
.nav { flex: none; width: 64px; min-height: 64px; border-radius: 14px; background: var(--paper); font-size: 28px; font-weight: 700; box-shadow: 0 2px 0 var(--line); }
.nav:disabled { opacity: .35; cursor: default; }
.big.picked { outline: 4px solid var(--ink); outline-offset: 2px; }
/* Félicitations */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; font-family: var(--display); font-weight: 600; font-size: 22px; padding: 14px 24px; border-radius: 99px; box-shadow: 0 10px 30px rgba(29,43,79,.3); z-index: 20; max-width: calc(100% - 32px); text-align: center; animation: pop .3s ease-out; }
@keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.medal { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 56px; box-shadow: 0 6px 0 #d99a1a; }
.end .sub { margin: 0; font-size: 20px; color: var(--muted); max-width: 40ch; }
/* Dictée */
.listen { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.say { min-height: 56px; padding: 0 22px; border-radius: 14px; background: var(--pen); color: #fff; font-family: var(--display); font-weight: 800; font-size: 22px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.say.alt { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--line); font-size: 19px; }
.say:active { transform: translateY(3px); }
.answer .phrase { margin: 0; font-size: 19px; color: var(--muted); line-height: 1.4; }
/* Opérations posées */
.pose { display: inline-flex; flex-direction: column; font-family: var(--body); font-size: clamp(26px, 3.4vw, 34px); font-variant-numeric: tabular-nums; line-height: 1.35; align-self: flex-start; }
.pose .row { display: flex; }
.pose .row.line { border-top: 3px solid var(--ink); margin-top: 4px; padding-top: 4px; }
.pose .row.res { color: var(--good); font-weight: 700; }
.pose .cell { width: 0.95em; text-align: center; position: relative; }
.pose .cell.sign { color: var(--muted); }
.pose .cell.fade { color: var(--muted); opacity: .45; }
.pose .cell i { position: absolute; right: -0.18em; font-style: normal; }
.pose .cell i.fade { opacity: .45; }
/* Questionnaire */
.choices { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.choice { text-align: left; background: var(--paper); border-radius: 14px; padding: 18px 22px; font-size: 22px; line-height: 1.3; box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(29,43,79,.06); border: 3px solid transparent; }
.choice.right { border-color: var(--good); background: #eaf7ef; }
.choice.wrong { border-color: var(--bad); background: #fbeaea; }
.choice:disabled { cursor: default; color: var(--ink); }
.verdict { background: #fff; border-radius: 14px; padding: 16px 20px; font-size: 20px; line-height: 1.4; border: 2px solid var(--line); }
.verdict b { font-family: var(--display); font-size: 24px; display: block; margin-bottom: 4px; }
.verdict.ok b { color: var(--good); } .verdict.ko b { color: var(--bad); }
.qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.coursebtn { flex: none; background: var(--paper); border-radius: 12px; padding: 10px 14px; font-size: 17px; box-shadow: 0 2px 0 var(--line); }
/* Panneau du cours */
.cours { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); background: var(--paper); z-index: 25; box-shadow: -10px 0 40px rgba(29,43,79,.25); display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top, 0px)) 20px 20px; gap: 14px; overflow-y: auto; animation: slidein .25s ease-out; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.cours header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cours h3 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; }
.cours h4 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 6px 0 0; color: var(--pen); }
.cours p, .cours li { font-size: 19px; line-height: 1.45; margin: 0; }
.cours ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.cours .ex { background: var(--desk); border-radius: 12px; padding: 12px 18px; display: flex; flex-direction: column; gap: 6px; }
.cours.photo { width: min(820px, 96vw); }
.cours .page { width: 100%; border-radius: 10px; box-shadow: 0 2px 10px rgba(29,43,79,.15); cursor: zoom-in; }
.cours .page.zoom { width: 180%; max-width: none; cursor: zoom-out; }
.cours .pagewrap { overflow: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; }
/* Case de réponse (corrigée par l'app) */
.saisie { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.saisie label { align-self: center; font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--muted); }
.saisie input { flex: 1; min-width: 200px; min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); padding: 0 18px; font-family: var(--display); font-size: 30px; color: var(--pen); -webkit-user-select: text; user-select: text; }
.saisie input:focus { outline: none; border-color: var(--pen); }
.saisie .big { flex: 0 1 200px; }
.answer.ko { border-color: var(--bad); }
/* La correction se pose à droite et se replie : la feuille de l'enfant reste visible. */
@media (min-width: 900px) { .answer { left: auto; width: min(480px, 46%); max-height: calc(100% - 72px); } }
.answer .fold { align-self: flex-end; margin: -6px -8px 0 0; background: var(--desk); border-radius: 10px; padding: 6px 12px; font-size: 16px; }
.answer.mini { max-height: none; gap: 0; padding: 10px 14px; }
.answer.mini > :not(.fold) { display: none; }
.answer.mini .fold { margin: 0; align-self: stretch; text-align: center; background: none; font-weight: 700; color: var(--pen); }
/* Grande ligne de cahier (Seyès) où l'on écrit au crayon : Griffonner la transforme en texte. */
.ligne { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
.seyes { position: relative; flex: 1 1 520px; max-width: 760px; height: 144px; border-radius: 14px; overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 63px, var(--margin-red) 63px, var(--margin-red) 65px, transparent 65px),
    linear-gradient(var(--seyes-thick) 1.5px, transparent 1.5px),
    linear-gradient(var(--seyes-thin) 1px, transparent 1px);
  background-size: 100% 100%, 100% 48px, 100% 12px;
  background-position: 0 0, 0 47px, 0 11px;
  box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(29,43,79,.08); border: 2px solid var(--line); }
.seyes:focus-within { border-color: var(--pen); }
/* Zone d'écriture : un bloc éditable (pas un champ de formulaire) pour que le texte suive les règles normales de la page,
   identiques sur Safari et ailleurs. Une copie invisible (.probe) sert à mesurer où tombe le pied des lettres. */
.seyes .ecrit { position: absolute; left: 0; right: 0; top: 0; padding: 0 20px 0 84px; margin: 0;
  font-family: var(--body); font-size: 54px; line-height: 1.25; white-space: nowrap; overflow: hidden;
  color: var(--pen); outline: none; -webkit-user-select: text; user-select: text; cursor: text; }
.seyes .ecrit:empty::before { content: attr(data-ph); color: var(--muted); opacity: .45; font-size: 26px; }
.seyes .ecrit[contenteditable="false"] { color: var(--ink); cursor: default; }
.seyes .probe { visibility: hidden; pointer-events: none; }
.seyes .probe i { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
.seyes.court { height: 96px; flex-basis: 360px; max-width: 520px; background-image: none; }
.seyes.court .ecrit { padding-left: 24px; }
.seyes.court .ecrit { font-size: 44px; }
.ligne .big { flex: 0 0 auto; min-width: 180px; }
.outils { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.outils .tool { position: static; font-size: 20px; min-width: 64px; min-height: 52px; padding: 8px 16px; border-radius: 12px; background: var(--paper); box-shadow: 0 2px 0 var(--line); }
#apos { font-size: 30px; font-weight: 800; }
.sheet.dictee { display: flex; align-items: center; justify-content: center; padding: 24px 24px 24px 24px; background-image: none; background-color: transparent; box-shadow: none; overflow: visible; }
.sheet.dictee { flex-direction: column; gap: 18px; }
.sheet.dictee .ligne { flex-direction: column; }
.sheet.dictee .answer { position: static; width: min(760px, 100%); max-height: none; }
.sheet.dictee .answer .fold { display: none; }
.sheet.dictee .seyes { flex: 0 0 auto; width: min(760px, 100%); height: clamp(120px, 24vh, 192px); }
/* Outils et « Vérifier » sur une seule ligne, pour que tout tienne même avec une longue question */
.ligne-actions { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.sheet.dictee { padding-top: 12px; padding-bottom: 12px; gap: 12px; }
.sheet.dictee .seyes .ecrit { font-size: 64px; }
/* Dictée bilan : une phrase entière, sur plusieurs lignes du cahier */
.sheet.dictee.bilan .seyes { height: auto; min-height: 192px; }
.sheet.dictee.bilan .seyes .ecrit { position: relative; top: auto !important; white-space: normal; font-size: 36px; line-height: 48px; min-height: 144px; padding: 6px 20px 18px 84px; }
.sheet.dictee.bilan .seyes .probe { display: none; }
.essai { margin: 0; font-size: 20px; font-weight: 700; color: var(--bad, #c0392b); }
.stop { text-align: center; }
.stop .medal { background: var(--accent); }
.choixbilan { display: flex; flex-direction: column; gap: 14px; width: min(520px, 100%); }
.choixbilan .big { width: 100%; }
.big.retry { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.niveaux { display: flex; gap: 10px; flex-wrap: wrap; }
.niveaux button { min-width: 84px; min-height: 64px; border-radius: 14px; background: var(--paper); font-family: var(--display); font-weight: 800; font-size: 24px; box-shadow: 0 2px 0 var(--line); }
.niveaux button.on { background: var(--accent); color: var(--accent-ink); }
.lvl { font-size: .5em; vertical-align: middle; background: var(--label); color: var(--accent-ink); border: 1px dashed var(--accent); border-radius: 99px; padding: 2px 12px; margin-left: 8px; }
.answer .verdict-line { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; }
.answer .verdict-line.ok { color: var(--good); } .answer .verdict-line.ko { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<canvas class="confetti" id="confetti" hidden></canvas>

<script>
window.__boot = () => {
  let DECKS = (() => { try { return JSON.parse(localStorage.getItem("cartable:paquets")) || []; } catch (e) { return []; } })();
  let PROG = (() => { try { return JSON.parse(localStorage.getItem("cartable:programme")) || {}; } catch (e) { return {}; } })();
  const app = document.getElementById("app");
  // Le prénom et les scores restent sur cet iPad (stockage local), jamais en ligne.
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("cartable:" + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("cartable:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let user = store.get("current");
  let wakeLock = null;
  const keepAwake = async () => { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} };
  const letSleep = () => { try { wakeLock?.release(); } catch (e) {} wakeLock = null; };

  /* ---------- Le coffre (dépôt GitHub privé) ---------- */
  // Les paquets, le cours et la progression vivent dans un dépôt privé. L'app y accède avec une clé
  // limitée à ce seul dépôt, collée une fois dans les Réglages. Tout est gardé sur l'iPad pour marcher sans réseau.
  const COFFRE = "https://api.github.com/repos/BMax-alt/le-cartable-data/contents/";
  const token = () => store.get("token");
  async function gh(path, opts = {}, accept = "application/vnd.github+json") {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), opts.timeout || 12000);
    try {
      return await fetch(COFFRE + path.split("/").map(encodeURIComponent).join("/"), {
        method: opts.method || "GET", body: opts.body, signal: ctl.signal, cache: "no-store",
        headers: { Authorization: "Bearer " + token(), Accept: accept, "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) }
      });
    } finally { clearTimeout(tm); }
  }
  const b64enc = str => { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); };
  const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));

  async function loadDecks() {
    const r = await gh("paquets.json", {}, "application/vnd.github.raw+json");
    if (!r.ok) throw new Error("paquets " + r.status);
    const d = await r.json();
    DECKS = d; store.set("paquets", d);
    // Programme de la semaine (ce qu'il faut savoir pour chaque jour) : facultatif.
    try { const pr = await gh("programme.json", {}, "application/vnd.github.raw+json"); if (pr.ok) { PROG = await pr.json(); store.set("programme", PROG); } } catch (e) {}
    return d;
  }
  // Images du cours : téléchargées une fois, gardées sur l'iPad. Le cache ne doit jamais bloquer l'affichage :
  // chaque opération de cache a un délai maximum, et l'enregistrement se fait sans attendre.
  const within = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  async function coursImage(path) {
    const key = location.origin + "/__cours/" + path;
    let cache = null;
    try { cache = await within(caches.open("cartable-cours"), 1500); } catch (e) {}
    try { const hit = cache && await within(cache.match(key), 1500); if (hit) return URL.createObjectURL(await hit.blob()); } catch (e) {}
    const r = await gh(path, { timeout: 30000 }, "application/vnd.github.raw+json");
    if (!r.ok) throw new Error("cours " + r.status);
    const blob = await r.blob();
    try { cache?.put(key, new Response(blob, { headers: { "Content-Type": blob.type || "image/jpeg" } })).catch(() => {}); } catch (e) {}
    return URL.createObjectURL(blob);
  }

  /* ---------- Progression et sauvegarde automatique ---------- */
  // Chaque réponse est notée sur l'iPad tout de suite, puis envoyée dans le coffre :
  // progression/<prénom>/<AAAA-MM>.json. Sans réseau, l'envoi attend et repart plus tard.
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "eleve";
  const monthOf = iso => iso.slice(0, 7);
  const progKey = u => "prog:" + u;
  function localProg(u) { return store.get(progKey(u)) || { seances: {}, dirty: [] }; }
  function saveSeance(u, sc) {
    const p = localProg(u);
    p.seances[sc.id] = sc;
    const m = monthOf(sc.debut); if (!p.dirty.includes(m)) p.dirty.push(m);
    store.set(progKey(u), p);
    scheduleSync();
  }
  let syncTimer = null, syncing = false;
  const syncState = { last: store.get("lastsync"), error: null };
  function scheduleSync(delay = 20000) { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, delay); }
  async function syncNow() {
    clearTimeout(syncTimer);
    if (syncing || !token()) return;
    syncing = true;
    const tous = [...new Set([...(store.get("users") || []), ...eleves().map(e => e.prenom), ...(user ? [user] : [])])];
    try {
     for (const u of tous) {
      const p = localProg(u);
      for (const m of p.dirty.slice()) {
        const path = `progression/${slug(u)}/${m}.json`;
        for (let attempt = 0; attempt < 2; attempt++) {
          let sha, remote = { prenom: u, mois: m, seances: [] };
          const g = await gh(path);
          if (g.ok) { const j = await g.json(); sha = j.sha; try { remote = JSON.parse(b64dec(j.content)); } catch (e) {} }
          else if (g.status !== 404) throw new Error("lecture " + g.status);
          // Fusion : on garde, pour chaque séance, la version qui a le plus de réponses.
          const byId = {}; (remote.seances || []).forEach(sc => byId[sc.id] = sc);
          Object.values(localProg(u).seances).filter(sc => monthOf(sc.debut) === m).forEach(sc => {
            if (!byId[sc.id] || (sc.reponses?.length || 0) >= (byId[sc.id].reponses?.length || 0)) byId[sc.id] = sc;
          });
          const out = { prenom: u, mois: m, seances: Object.values(byId).sort((a, b) => a.debut < b.debut ? -1 : 1) };
          const put = await gh(path, { method: "PUT", body: JSON.stringify({ message: `Progression ${u} ${new Date().toISOString().slice(0, 16).replace("T", " ")}`, content: b64enc(JSON.stringify(out, null, 1)), ...(sha ? { sha } : {}) }) });
          if (put.ok) { const q = localProg(u); q.dirty = q.dirty.filter(x => x !== m); store.set(progKey(u), q); break; }
          if (!(put.status === 409 || put.status === 422) || attempt) throw new Error("écriture " + put.status);
        }
      }
     }
      syncState.last = new Date().toISOString(); syncState.error = null; store.set("lastsync", syncState.last);
    } catch (e) {
      syncState.error = String(e.message || e);
      scheduleSync(60000);
    } finally { syncing = false; renderSyncBadge(); }
  }
  // Récupération : au démarrage, on relit dans le coffre les séances du mois en cours et du mois précédent,
  // pour chaque élève. Une app réinstallée (ou un nouvel iPad) retrouve ainsi sa progression et ses séances en cours.
  async function pullProgress() {
    if (!token()) return;
    const now = new Date(), prev = new Date(now.getFullYear(), now.getMonth() - 1, 15);
    const mois = [now, prev].map(d => d.toISOString().slice(0, 7));
    const tous = [...new Set([...eleves().map(e => e.prenom), ...(store.get("users") || [])])];
    for (const u of tous) for (const m of mois) {
      try {
        const r = await gh(`progression/${slug(u)}/${m}.json`, {}, "application/vnd.github.raw+json");
        if (!r.ok) continue;
        const remote = await r.json(), p = localProg(u);
        (remote.seances || []).forEach(sc => {
          const loc = p.seances[sc.id];
          if (!loc || (sc.reponses?.length || 0) > (loc.reponses?.length || 0)) p.seances[sc.id] = sc;
        });
        store.set(progKey(u), p);
        // Résumé « Dernière fois » des paquets terminés, s'il manque sur cet appareil.
        Object.values(p.seances).filter(sc => sc.fin && !sc.abandon && sc.premierCoup != null).sort((a, b) => a.fin < b.fin ? -1 : 1).forEach(sc => {
          const k = "deck:" + u + ":" + sc.paquet, cur = store.get(k);
          if (!cur || cur.date <= sc.fin.slice(0, 10)) store.set(k, { first: sc.premierCoup, total: sc.cartes, date: sc.fin.slice(0, 10) });
        });
      } catch (e) {}
    }
  }
  function syncLabel() {
    if (!token()) return "Sauvegarde non réglée";
    const enAttente = [...new Set([...(store.get("users") || []), ...eleves().map(e => e.prenom)])].some(u => localProg(u).dirty.length);
    if (enAttente) return syncState.error ? "Sauvegarde en attente (pas de réseau ?)" : "Sauvegarde en cours…";
    if (!syncState.last) return "Rien à sauvegarder pour l'instant";
    const d = new Date(syncState.last);
    return "Sauvegardé ✓ " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  function renderSyncBadge() { const el = document.getElementById("sync"); if (el) el.textContent = syncLabel(); }
  addEventListener("online", () => syncNow());
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") syncNow(); });

  /* ---------- Réglages : la clé du coffre ---------- */
  function settings(msg) {
    letSleep();
    app.innerHTML = `<div class="view who">
      <div class="brand"><h1>Réglages</h1>${token() ? '<button class="back" id="back">← Retour</button>' : ""}</div>
      <p class="hint">${msg ? esc(msg) + " " : ""}Colle ici la clé du coffre (le « token » GitHub du dépôt privé). C'est à faire une seule fois sur cet appareil.</p>
      <form class="newuser" id="tokform">
        <label for="tok">Clé du coffre</label>
        <div class="row">
          <input id="tok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…">
          <button class="big g" type="submit">Enregistrer</button>
        </div>
        <p class="hint" id="tokmsg"></p>
      </form>
      ${token() ? `<p class="hint">${esc(syncLabel())}</p>` : ""}
    </div>`;
    document.getElementById("back")?.addEventListener("click", () => user ? home() : who());
    document.getElementById("tokform").addEventListener("submit", async e => {
      e.preventDefault();
      const v = document.getElementById("tok").value.trim(), out = document.getElementById("tokmsg");
      if (!v) return;
      const old = token(); store.set("token", v); out.textContent = "Vérification…";
      try {
        await loadDecks();
        out.textContent = "C'est bon ! Je récupère les prénoms et la progression…";
        await within(loadEleves().catch(() => {}), 8000);
        await within(pullProgress().catch(() => {}), 15000);
        user && niveauDe(user) ? home() : who();
      }
      catch (err) { store.set("token", old); out.textContent = "Cette clé ne marche pas (" + err.message + "). Vérifie-la et réessaie."; }
    });
  }

  /* ---------- Félicitations ---------- */
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cv.hidden = false;
    const colors = ["#f2b632", "#2f9a5d", "#1f3fa6", "#e2696b", "#e08a1e"];
    const bits = Array.from({ length: 140 }, () => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.3,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: pick(colors)
    }));
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.vy += 0.04; b.r += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
      }
      if (t - t0 < 3200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    })(t0);
  }

  /* ---------- Voix de la dictée ---------- */
  // Voix française intégrée à l'iPad (gratuite, sans serveur). Le mot, une phrase qui le contient, puis le mot.
  const voice = {
    v: null,
    pick() {
      const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      const fr = all.filter(x => /^fr[-_]FR/i.test(x.lang));
      const any = fr.length ? fr : all.filter(x => /^fr/i.test(x.lang));
      this.v = any.find(x => /premium|enhanced|amélioré/i.test(x.name)) || any.find(x => x.localService) || any[0] || null;
    },
    say(parts) {
      if (!window.speechSynthesis) return toast("La voix ne marche pas sur cet appareil.");
      speechSynthesis.cancel();
      if (!this.v) this.pick();
      parts.forEach(t => {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = "fr-FR"; if (this.v) u.voice = this.v;
        u.rate = 0.8;
        speechSynthesis.speak(u);
      });
    },
    stop() { try { window.speechSynthesis?.cancel(); } catch (e) {} }
  };
  if (window.speechSynthesis) { voice.pick(); speechSynthesis.addEventListener?.("voiceschanged", () => voice.pick()); }
  // Par défaut, le mot seul. La phrase d'exemple seulement si l'enfant la demande.
  const dictate = c => voice.say([c.mot != null ? c.mot + "." : c.phrase]);
  const sayPhrase = c => voice.say([c.phrase, c.mot + "."]);

  /* ---------- Opérations posées ---------- */
  // Calcul en nombres entiers (pas d'erreur d'arrondi), puis affichage colonne par colonne.
  // + et − : virgules alignées, les 0 ajoutés sont pâles. × : chiffres alignés à droite, comme s'il n'y avait pas de virgule.
  const parseN = s => { const [i, d = ""] = String(s).split(","); return { i, d }; };
  const fmt = (n, dec) => { const s = String(n).padStart(dec + 1, "0"); return dec ? s.slice(0, s.length - dec) + "," + s.slice(s.length - dec) : s; };
  function solve(op, nums) {
    if (op === "×") {
      let [a, b] = nums.map(parseN);
      if ((b.i + b.d).length > (a.i + a.d).length) [a, b] = [b, a];
      const ta = +(a.i + a.d), tb = +(b.i + b.d), dec = a.d.length + b.d.length;
      const partials = [];
      const bd = (b.i + b.d).split("").reverse();
      if (bd.length > 1) bd.forEach((d, k) => { if (+d) partials.push(String(ta * +d) + "0".repeat(k)); });
      return { kind: "×", a, b, partials, res: String(ta * tb).padStart(dec + 1, "0"), dec, r: fmt(ta * tb, dec) };
    }
    const ps = nums.map(parseN), dec = Math.max(...ps.map(p => p.d.length));
    const ints = ps.map(p => +(p.i + p.d.padEnd(dec, "0")));
    const total = op === "+" ? ints.reduce((x, y) => x + y, 0) : ints.slice(1).reduce((x, y) => x - y, ints[0]);
    return { kind: op, ps, dec, res: String(total).padStart(dec + 1, "0"), r: fmt(total, dec) };
  }
  function poseHtml(op, nums, withResult) {
    const S = solve(op, nums), rows = [];
    if (S.kind === "×") {
      const row = (p, sign) => ({ sign, digits: (p.i + p.d).split(""), comma: p.d ? p.i.length - 1 : -1 });
      rows.push(row(S.a, ""), row(S.b, "×"));
      if (withResult) {
        S.partials.forEach((p, k) => rows.push({ sign: k && k === S.partials.length - 1 ? "+" : "", digits: p.split(""), comma: -1, line: k === 0 }));
        rows.push({ sign: "", digits: S.res.split(""), comma: S.dec ? S.res.length - S.dec - 1 : -1, line: true, res: true });
      }
    } else {
      S.ps.forEach((p, k) => {
        const digits = (p.i + p.d.padEnd(S.dec, "0")).split("");
        const fade = new Set(); for (let j = p.i.length + p.d.length; j < digits.length; j++) fade.add(j);
        rows.push({ sign: k ? op : "", digits, fade, comma: S.dec ? p.i.length - 1 : -1, commaFade: !p.d && S.dec > 0 });
      });
      if (withResult) rows.push({ sign: "", digits: S.res.split(""), comma: S.dec ? S.res.length - S.dec - 1 : -1, line: true, res: true });
    }
    const n = Math.max(...rows.map(r => r.digits.length)) + 1;
    const html = rows.map(r => {
      const pad = n - 1 - r.digits.length;
      const cells = [`<span class="cell sign">${esc(r.sign)}</span>`];
      for (let j = 0; j < pad; j++) cells.push('<span class="cell"></span>');
      r.digits.forEach((d, j) => cells.push(`<span class="cell${r.fade?.has(j) ? " fade" : ""}">${d}${j === r.comma ? `<i${r.commaFade ? ' class="fade"' : ""}>,</i>` : ""}</span>`));
      return `<div class="row${r.line ? " line" : ""}${r.res ? " res" : ""}">${cells.join("")}</div>`;
    }).join("");
    return { html: `<div class="pose" aria-label="${esc(nums.join(" " + op + " "))}">${html}</div>`, r: S.r };
  }

  /* ---------- Ligne de cahier : le texte posé sur une grosse ligne ---------- */
  // Les grosses lignes Seyès tombent à y = 47, 95, 143… (une tous les 48 px). On mesure la police pour que
  // la ligne de base du texte (le pied des lettres) se pose sur la dernière grosse ligne de la case.
  function alignLigne() {
    document.querySelectorAll(".seyes").forEach(box => {
      const ed = box.querySelector(".ecrit:not(.probe)"), probe = box.querySelector(".probe"), mark = probe?.querySelector("i");
      if (!ed || !mark) return;
      probe.style.top = "0px";
      // Position réelle du pied des lettres dans la bande de texte, mesurée par le navigateur lui-même.
      const base = mark.getBoundingClientRect().top - probe.getBoundingClientRect().top;
      const H = box.clientHeight, desc = probe.getBoundingClientRect().height - base;
      let top;
      if (box.classList.contains("court")) top = Math.round((H - probe.getBoundingClientRect().height) / 2) + "px"; // case blanche (maths) : texte centré
      else {
        let thick = 47; while (thick + 48 <= H - desc * 0.7) thick += 48; // dernière grosse ligne qui laisse la place aux jambages
        if (thick - 48 >= base) thick -= 48;  // puis une grande case plus haut (demande de Ben, 08/11), si les lettres hautes ont la place
        top = Math.round(thick + 0.75 - base) + "px";
      }
      ed.style.top = top; probe.style.top = top;
    });
  }
  try { document.fonts?.ready.then(alignLigne); } catch (e) {}
  addEventListener("resize", alignLigne);

  /* ---------- Correction automatique (comparaison simple, sans IA) ---------- */
  function checkNombre(saisi, attendu) {
    const norm = x => String(x).replace(/\s/g, "").replace(".", ",");
    const a = norm(saisi), b = norm(attendu);
    if (!/^\d+(,\d+)?$/.test(a)) return { ok: false, msg: "Je n'arrive pas à lire un nombre." };
    const ok = Math.abs(Number(a.replace(",", ".")) - Number(b.replace(",", "."))) < 1e-9;
    if (ok) return { ok };
    const dec = s => (s.split(",")[1] || "").replace(/0+$/, "").length;
    const sameDigits = a.replace(",", "").replace(/^0+/, "") === b.replace(",", "").replace(/^0+/, "");
    return { ok: false, msg: sameDigits && dec(a) !== dec(b) ? "Les chiffres sont bons, mais regarde où tu as mis la virgule." : "" };
  }
  function checkMot(saisi, attendu) {
    const norm = x => String(x).normalize("NFC").replace(/[’‘`´]/g, "'").replace(/œ/g, "oe").replace(/Œ/g, "Oe").replace(/\s*([,/])\s*/g, ", ").replace(/\s+/g, " ").trim();
    // Deux formes du même mot (« étonnant, étonnante ») : la virgule entre les deux n'est pas une faute de dictée.
    if (/, /.test(norm(attendu)) && !/[.!?]$/.test(norm(attendu))) { const nv = x => norm(x).replace(/,/g, " ").replace(/\s+/g, " "); const l1 = x => x ? x[0].toLowerCase() + x.slice(1) : x; if (l1(nv(saisi)) === l1(nv(attendu))) saisi = attendu;
      // Le féminin noté entre parenthèses, comme en classe : « étonnant(e) » vaut « étonnant, étonnante ».
      const [m, f] = norm(attendu).split(", ");
      const court = f && f.startsWith(m) && f.length > m.length ? `${m}(${f.slice(m.length)})` : null;
      if (court && l1(norm(saisi).replace(/\s*([()])\s*/g, "$1")) === court) saisi = attendu; }
    let a = norm(saisi);
    const b = norm(attendu);
    // Griffonner met d'office une majuscule à la première lettre : si le mot attendu commence par une minuscule,
    // on ne la compte pas comme une faute. L'inverse (minuscule au lieu d'une majuscule) reste une erreur.
    if (b && b[0] === b[0].toLowerCase() && a[0] && a[0] !== a[0].toLowerCase()) a = a[0].toLowerCase() + a.slice(1);
    if (a === b) return { ok: true };
    if (a.toLowerCase() === b.toLowerCase()) return { ok: false, msg: "Presque : attention aux majuscules." };
    const sansAccents = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (sansAccents(a) === sansAccents(b)) return { ok: false, msg: "Presque : attention aux accents." };
    if (a.replace(/'/g, " ").replace(/\s+/g, " ").toLowerCase() === b.replace(/'/g, " ").replace(/\s+/g, " ").toLowerCase()) return { ok: false, msg: "Presque : il manque l'apostrophe (bouton ’ sous la case)." };
    return { ok: false, msg: "" };
  }
  // Exercice à trou : plusieurs réponses peuvent être acceptées (ex. « paie » ou « paye »).
  function checkRep(saisi, attendu) {
    // Tolérances pour une réponse d'un mot : un point final ajouté par Griffonner, ou l'article de la question
    // répété (« c'est le … » → « le garçon »).
    const att = [].concat(attendu);
    let v = String(saisi).trim();
    if (!att.some(a => /[.!?]$/.test(a))) v = v.replace(/\s*[.!?]+$/, "");
    // Les petits mots de la question que l'enfant réécrit devant sa réponse (« l'adolescence », « de l'eau », « à l'… »),
    // même si Griffonner a perdu l'apostrophe (« L adolescence »). Seulement si la réponse attendue n'en a pas.
    const petits = /^((le|la|les|l|un|une|des|de|du|d|à|a|au|aux)(\s+|\s*['’]\s*))+/i;
    const sans = v.replace(petits, "");
    if (sans && sans !== v && !att.some(a => petits.test(a)) && att.some(a => checkMot(sans, a).ok)) v = sans;
    saisi = v;
    const res = att.map(a => checkMot(saisi, a));
    return res.find(r => r.ok) || res.find(r => r.msg) || res[0];
  }
  // Dictée bilan : une phrase entière. Les espaces autour de la ponctuation ne comptent pas (Griffonner en met ou pas).
  function checkPhrase(saisi, attendu) {
    const sq = x => String(x).replace(/[’‘`´]/g, "'").replace(/\s*([.,:;!?'])\s*/g, "$1").replace(/\s+/g, " ").trim();
    const r = checkMot(sq(saisi), sq(attendu));
    if (r.ok || r.msg) return r;
    const nu = x => sq(x).replace(/[.,:;!?]/g, "").toLowerCase();
    if (nu(saisi) === nu(attendu)) return { ok: false, msg: "Presque : attention à la ponctuation." };
    return r;
  }
  function verdictHtml(v, saisi) {
    if (!v) return "";
    return v.ok
      ? `<p class="verdict-line ok">${esc(pick([`Bravo ${user} !`, "C'est juste !", "Exactement !"]))}</p>`
      : `<p class="verdict-line ko">Ce n'est pas ça : tu as écrit « ${esc(saisi)} ».</p>${v.msg ? `<p class="phrase">${esc(v.msg)}</p>` : ""}`;
  }

  /* ---------- Panneau du cours ---------- */
  function openCours(deck, key) {
    closeCours();
    const c = deck.cours?.[key]; if (!c) return;
    const el = document.createElement("aside");
    el.className = "cours" + (c.image ? " photo" : ""); el.id = "cours";
    if (c.image) {
      el.innerHTML = `<header><h3>${esc(c.titre)}</h3><button class="back" id="closecours">Fermer</button></header>
        <p class="hint">Touche la page pour l'agrandir.</p><div class="pagewrap" id="pagewrap"><p class="hint">Chargement du cours…</p></div>`;
      document.body.appendChild(el);
      el.querySelector("#closecours").onclick = closeCours;
      coursImage(c.image).then(url => {
        const w = el.querySelector("#pagewrap"); if (!w) return;
        w.innerHTML = `<img class="page" src="${url}" alt="${esc(c.titre)}">`;
        w.querySelector("img").onclick = e => e.target.classList.toggle("zoom");
      }).catch(() => { const w = el.querySelector("#pagewrap"); if (w) w.innerHTML = '<p class="hint">Le cours ne se charge pas (pas de réseau ?). Réessaie plus tard.</p>'; });
      return;
    }
    el.innerHTML = `<header><h3>${esc(c.titre)}</h3><button class="back" id="closecours">Fermer</button></header>` + c.blocs.map(b =>
      b.h ? `<h4>${esc(b.h)}</h4>`
      : b.p ? `<p>${esc(b.p)}</p>`
      : b.liste ? `<ul>${b.liste.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
      : b.ex ? `<div class="ex">${b.ex.texte ? `<p>${esc(b.ex.texte)}</p>` : ""}${poseHtml(b.ex.op, b.ex.nombres, true).html}</div>` : ""
    ).join("");
    document.body.appendChild(el);
    el.querySelector("#closecours").onclick = closeCours;
  }
  function closeCours() { document.getElementById("cours")?.remove(); }

  /* ---------- Élèves et niveaux ---------- */
  // eleves.json dans le coffre : [{ prenom, niveau }]. Chaque élève ne voit que les paquets de son niveau.
  const NIVEAUX = ["CP", "CE1", "CE2", "CM1", "CM2"];
  const eleves = () => store.get("eleves") || [];
  const niveauDe = name => (eleves().find(e => e.prenom === name) || {}).niveau || null;
  async function loadEleves() {
    const r = await gh("eleves.json", {}, "application/vnd.github.raw+json");
    if (r.status === 404) return eleves();
    if (!r.ok) throw new Error("élèves " + r.status);
    const list = await r.json(); store.set("eleves", list); return list;
  }
  async function saveEleve(prenom, niveau) {
    const local = eleves().filter(e => e.prenom !== prenom); local.push({ prenom, niveau }); store.set("eleves", local);
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        let sha, list = [];
        const g = await gh("eleves.json");
        if (g.ok) { const j = await g.json(); sha = j.sha; list = JSON.parse(b64dec(j.content)); }
        list = list.filter(e => e.prenom !== prenom); list.push({ prenom, niveau });
        const put = await gh("eleves.json", { method: "PUT", body: JSON.stringify({ message: `Élève ${prenom} (${niveau})`, content: b64enc(JSON.stringify(list, null, 1)), ...(sha ? { sha } : {}) }) });
        if (put.ok) { store.set("eleves", list); return; }
      } catch (e) {}
    }
  }
  function chooseNiveau(name) {
    app.innerHTML = `<div class="view who">
      <div class="brand"><h1>Bonjour ${esc(name)} !</h1><button class="back" id="back">← Retour</button></div>
      <h2 class="ask">Tu es en quelle classe ?</h2>
      <div class="niveaux">${NIVEAUX.map(n => `<button data-n="${n}">${n}</button>`).join("")}</div>
      <p class="hint">Tu ne verras que les leçons de ta classe.</p>
    </div>`;
    document.getElementById("back").onclick = who;
    app.querySelectorAll(".niveaux button").forEach(b => b.onclick = async () => { await saveEleve(name, b.dataset.n); login(name); });
  }

  /* ---------- Entrée par prénom ---------- */
  function who() {
    letSleep();
    const users = [...new Set([...eleves().map(e => e.prenom), ...(store.get("users") || [])])];
    app.innerHTML = `<div class="view who">
      <div class="brand"><h1>Le Cartable</h1><button class="back" id="reglages">Réglages</button></div>
      <h2 class="ask">Qui révise aujourd'hui ?</h2>
      ${users.length ? `<div class="users">${users.map(u => `<button class="user" data-u="${esc(u)}"><span class="initial">${esc(u.charAt(0).toUpperCase())}</span>${esc(u)}${niveauDe(u) ? `<span class="lvl">${esc(niveauDe(u))}</span>` : ""}</button>`).join("")}</div>` : ""}
      <form class="newuser" id="newuser">
        <label for="prenom">${users.length ? "Quelqu'un d'autre ? Écris ton prénom" : "Écris ton prénom pour commencer"}</label>
        <div class="row">
          <input id="prenom" name="prenom" maxlength="20" autocomplete="off" autocapitalize="words" placeholder="Ton prénom">
          <button class="big g" type="submit">C'est moi !</button>
        </div>
      </form>
    </div>`;
    app.querySelectorAll(".user").forEach(b => b.onclick = () => login(b.dataset.u));
    document.getElementById("reglages").onclick = () => settings();
    document.getElementById("newuser").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("prenom").value.trim().replace(/\s+/g, " ");
      if (!name) { document.getElementById("prenom").focus(); return; }
      const list = store.get("users") || [];
      if (!list.includes(name)) { list.push(name); store.set("users", list); }
      login(name);
    });
  }
  function login(name) {
    if (!niveauDe(name)) return chooseNiveau(name);
    user = name; store.set("current", name); accueil();
  }

  /* ---------- Accueil ---------- */
  /* ---------- Semaine et archives ---------- */
  // programme.json : { "AAAA-MM-JJ": [{ paquet, evaluation? }] }, recopié de la fiche de la maîtresse.
  // Chaque date dit ce qu'il faut SAVOIR ce jour-là (on le travaille avant).
  const MATIERES = ["Histoire", "Français", "Maths", "Dictées", "Géographie", "Sciences de la matière", "SVT"];
  const JOURS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const dayIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fromIso = x => { const [y, m, j] = x.split("-").map(Number); return new Date(y, m - 1, j); };
  const addDays = (x, n) => { const d = fromIso(x); d.setDate(d.getDate() + n); return dayIso(d); };
  const longDate = x => { const d = fromIso(x); return `${JOURS[d.getDay()].toLowerCase()} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
  const todayIso = () => dayIso(new Date());
  // Du lundi au vendredi de la semaine en cours ; le samedi et le dimanche, la semaine qui vient.
  function semaine() {
    const d = new Date(); const w = d.getDay();
    d.setDate(d.getDate() + (w === 6 ? 2 : w === 0 ? 1 : 1 - w));
    return [0, 1, 2, 3, 4].map(k => addDays(dayIso(d), k));
  }
  const mesPaquets = () => DECKS.filter(d => (d.niveau || "CM2") === niveauDe(user));
  const entreesDu = date => (PROG[date] || []).map(e => ({ ...e, deck: mesPaquets().find(d => d.id === e.paquet) })).filter(e => e.deck);
  const datesDe = id => Object.keys(PROG).filter(x => (PROG[x] || []).some(e => e.paquet === id)).sort();
  // Une séance compte quand elle est allée au bout de toutes les cartes du paquet.
  // (complet : posé à la fin d'une séance entière ; pour les séances plus anciennes, on se fie au nombre de cartes
  // ou au résumé « Dernière fois », qui n'est écrit que pour une séance entière, même si le paquet a changé depuis.)
  const finies = deck => {
    const last = store.get("deck:" + user + ":" + deck.id);
    return Object.values(localProg(user).seances)
      .filter(sc => sc.paquet === deck.id && sc.fin && !sc.abandon && sc.premierCoup != null
        && (sc.complet || sc.cartes === deck.cartes.length || (last && last.date === sc.fin.slice(0, 10) && last.total === sc.cartes)))
      .map(sc => dayIso(new Date(sc.fin)));
  };
  const fait = deck => finies(deck).length > 0;
  // Fait pour un jour : terminé depuis la date précédente où le paquet était à savoir (au plus 7 jours avant), jusqu'au jour même.
  function faitPour(deck, date) {
    const avant = datesDe(deck.id).filter(x => x < date).pop();
    const debut = [avant, addDays(date, -7)].filter(Boolean).sort().pop();
    return finies(deck).some(x => x >= debut && x <= date);
  }
  const jourFait = date => { const e = entreesDu(date); return e.length > 0 && e.every(x => faitPour(x.deck, date)); };
  // Une dictée (plusieurs groupes) compte pour une seule leçon.
  const nbLecons = entrees => new Set(entrees.map(e => e.deck.serie || e.deck.id)).size;

  function deckButtons(list, opts = {}) {
    let serie = null;
    return list.map(({ deck: d, evaluation }) => {
      const last = store.get("deck:" + user + ":" + d.id);
      const enCours = seanceEnCours(d.id);
      const ok = opts.date ? faitPour(d, opts.date) : fait(d);
      const meta = enCours ? `En cours : ${Object.keys(enCours.etat.grade).length}/${enCours.etat.order.length} · tour ${enCours.etat.round}`
        : last ? `Dernière fois : ${last.first}/${last.total} du premier coup` : "Pas encore révisé";
      const dates = opts.archives ? datesDe(d.id) : [];
      const pour = dates.find(x => x > todayIso()) || dates.pop();
      const head = d.serie && d.serie !== serie ? `<h3 class="serie">${esc(d.serie)}</h3>` : "";
      serie = d.serie || null;
      return `${head}<button class="deck${ok ? " done" : ""}" data-id="${esc(d.id)}">
          ${evaluation ? '<span class="tag eval">Évaluation</span>' : ""}
          <strong>${esc(d.bilan ? "Dictée bilan" : d.serie && d.groupe ? "Groupe " + d.groupe : d.titre)}</strong>
          <span>${plural(d.cartes.length, d.dictee ? (d.bilan ? "phrase" : "mot") : "carte")}</span>
          ${pour ? `<span class="pour">À savoir pour le ${esc(longDate(pour))}</span>` : ""}
          ${ok ? '<span class="fait">✓ Fait</span>' : ""}
          <span class="meta">${meta}</span>
        </button>`;
    }).join("");
  }
  function bindDecks() {
    app.querySelectorAll(".deck").forEach(b => b.addEventListener("click", () => {
      const d = DECKS.find(x => x.id === b.dataset.id);
      const enCours = seanceEnCours(d.id);
      enCours ? askResume(d, enCours) : d.bilan ? choixBilan(d) : start(d, d.cartes.map((_, i) => i));
    }));
  }
  // Après une séance, on revient là d'où l'on vient : le jour ou l'accueil.
  let retour = null;
  const back = () => retour === "archives" ? archives() : retour ? jour(retour) : home();

  // Le jour qu'on prépare : le prochain jour (après aujourd'hui) qui a des leçons. Lundi soir, c'est mardi.
  const jourCible = () => { const t = todayIso(); return semaine().find(x => x > t && entreesDu(x).length) || null; };
  // À l'ouverture de l'app, on arrive directement sur ce jour-là (sinon sur la semaine).
  let surSemaine = false;
  function accueil() { const c = jourCible(); c && !surSemaine ? jour(c) : home(); }
  // Une liste de paquets rangée par matière, dans l'ordre fixe des matières.
  function parMatiere(entrees, opts) {
    const ms = [...MATIERES, ...new Set(entrees.map(e => e.deck.matiere).filter(m => !MATIERES.includes(m)))];
    return ms.map(m => {
      const list = entrees.filter(e => e.deck.matiere === m);
      return list.length ? `<section class="matiere"><h2>${esc(m)}</h2><div class="decks">${deckButtons(list, opts)}</div></section>` : "";
    }).join("");
  }

  function home() {
    letSleep();
    if (store.get("majEnAttente")) { store.set("majEnAttente", false); return location.reload(); }
    retour = null;
    if (!user) return who();
    const niveau = niveauDe(user);
    if (!niveau) return chooseNiveau(user);
    // Sans programme de la maîtresse pour ce niveau (ex. CE1) : pas de semaine. La leçon à revoir en haut,
    // puis toutes les leçons par matière. « À revoir » = les paquets ajoutés en dernier (champ ajoute, AAAA-MM-JJ).
    const mes = mesPaquets();
    if (!Object.values(PROG).some(l => (l || []).some(e => mes.some(d => d.id === e.paquet)))) {
      const dates = mes.map(d => d.ajoute).filter(Boolean).sort();
      const der = dates.pop();
      const aRevoir = der ? mes.filter(d => d.ajoute === der) : mes.slice(-1);
      app.innerHTML = `<div class="view home">
        <div class="brand"><h1>Bonjour ${esc(user)} !<span class="lvl">${esc(niveau)}</span></h1><button class="back" id="switch">Changer de prénom</button></div>
        ${aRevoir.length ? `<section class="matiere"><h2>À revoir</h2><div class="decks">${deckButtons(aRevoir.map(deck => ({ deck })))}</div></section>` : ""}
        ${parMatiere(mes.map(deck => ({ deck })), {})}
        ${mes.length ? "" : '<p class="hint">Aucune leçon pour l\'instant.</p>'}
        <p class="hint" id="sync">${esc(syncLabel())}</p>
      </div>`;
      document.getElementById("switch").onclick = () => { user = null; store.set("current", null); surSemaine = false; who(); };
      bindDecks();
      return;
    }
    const today = todayIso(), cible = jourCible();
    const jours = semaine().map(date => {
      const e = entreesDu(date), n = nbLecons(e), d = fromIso(date);
      const cls = [n ? "" : "empty", date === cible ? "today" : "", date <= today ? "past" : "", n && jourFait(date) ? "done" : ""].filter(Boolean).join(" ");
      return `<button class="day ${cls}" data-date="${date}" ${n ? "" : "disabled"}>
        <small>à savoir pour</small><b>${JOURS[d.getDay()].slice(0, 3)}. ${d.getDate()}</b>
        <span class="n">${n ? (jourFait(date) ? "✓ Tout est fait" : plural(n, "leçon")) : "—"}</span></button>`;
    }).join("");
    app.innerHTML = `<div class="view home">
      <div class="brand"><h1>Bonjour ${esc(user)} !<span class="lvl">${esc(niveau)}</span></h1><button class="back" id="switch">Changer de prénom</button></div>
      <p class="hint">Ce qu'il faut savoir pour chaque jour de la semaine.</p>
      <section><div class="week">${jours}</div></section>
      <button class="deck archives-btn" id="archives"><strong>📚 Archives</strong><span>Toutes mes leçons, par matière</span></button>
      ${DECKS.length ? "" : '<p class="hint">Aucun paquet de cartes pour l\'instant.</p>'}
      <p class="hint" id="sync">${esc(syncLabel())}</p>
    </div>`;
    document.getElementById("switch").onclick = () => { user = null; store.set("current", null); surSemaine = false; who(); };
    app.querySelectorAll(".day[data-date]").forEach(b => b.onclick = () => jour(b.dataset.date));
    document.getElementById("archives").onclick = archives;
  }

  function archives() {
    letSleep();
    if (store.get("majEnAttente")) { store.set("majEnAttente", false); return location.reload(); }
    retour = "archives";
    app.innerHTML = `<div class="view home">
      <div class="topbar"><button class="back" id="week">← Semaine</button></div>
      <div class="brand"><h1>Archives</h1></div>
      <p class="hint">Toutes mes leçons, par matière, avec le jour où il fallait les savoir.</p>
      ${parMatiere(mesPaquets().map(deck => ({ deck })), { archives: true }) || '<p class="hint">Aucune leçon pour l\'instant.</p>'}
      <p class="hint" id="sync">${esc(syncLabel())}</p>
    </div>`;
    document.getElementById("week").onclick = () => { surSemaine = true; home(); };
    bindDecks();
  }

  function jour(date) {
    letSleep();
    if (store.get("majEnAttente")) { store.set("majEnAttente", false); return location.reload(); }
    retour = date;
    app.innerHTML = `<div class="view home">
      <div class="topbar"><button class="back" id="week">← Semaine</button></div>
      <div class="brand"><h1>Pour le ${esc(longDate(date))}</h1></div>
      <p class="hint">${jourFait(date) ? `Tout est fait, bravo ${esc(user)} !` : "Ce qu'il faut savoir ce jour-là. Révise-le avant !"}</p>
      ${parMatiere(entreesDu(date), { date })}
      <p class="hint" id="sync">${esc(syncLabel())}</p>
    </div>`;
    document.getElementById("week").onclick = () => { surSemaine = true; home(); };
    bindDecks();
  }

  /* ---------- Séance ---------- */
  // Un tour = toutes les cartes dans l'ordre, navigation libre. Les cartes pas sues repassent au tour suivant.
  // La séance garde son état (tour, cartes notées, réponses écrites) : on peut quitter et reprendre.
  // Les traits de crayon restent sur cet iPad seulement (trop lourds pour la sauvegarde).
  function seanceEnCours(deckId) {
    if (!user) return null;
    const sc = Object.values(localProg(user).seances).filter(sc => sc.paquet === deckId && !sc.fin && sc.reponses?.length)
      .sort((a, b) => a.debut < b.debut ? 1 : -1)[0];
    if (!sc) return null;
    if (!sc.etat) { const deck = DECKS.find(d => d.id === deckId); if (!deck) return null; sc.etat = rebuildEtat(sc, deck); }
    return sc;
  }
  // Séance enregistrée avant l'ajout de la reprise (pas d'état) : on reconstruit l'état à partir des réponses.
  function rebuildEtat(sc, deck) {
    const indices = deck.cartes.map((_, i) => i);
    const round = Math.max(1, ...sc.reponses.map(r => r.tour || 1));
    const first = {}, grade = {}, saisie = {}, shown = {};
    sc.reponses.forEach(r => {
      if ((r.tour || 1) === 1 && first[r.carte] == null) first[r.carte] = r.note;
      if ((r.tour || 1) === round) { grade[r.carte] = r.note; shown[r.carte] = true; if (r.saisie != null) saisie[r.carte] = r.saisie; }
    });
    let order = indices;
    if (round > 1) {
      const last = {}; sc.reponses.filter(r => (r.tour || 1) === round - 1).forEach(r => last[r.carte] = r.note);
      order = indices.filter(i => last[i] !== 2);
    }
    return { indices, round, order, pos: 0, grade, first, saisie, shown, pick: {}, streak: 0 };
  }
  const inkKey = sc => "ink:" + user + ":" + sc.id;
  // En naviguant : on garde l'état si la séance a déjà commencé (sinon rien à reprendre).
  function keep(s) { if (s.seance.reponses.length) persist(s); else store.set(inkKey(s.seance), s.ink); }
  function persist(s) {
    s.seance.etat = { indices: s.indices, round: s.round, order: s.order, pos: s.pos, grade: s.grade, first: s.first, saisie: s.saisie, shown: s.shown, pick: s.pick, streak: s.streak, essais: s.essais, brouillon: s.brouillon };
    saveSeance(user, s.seance);
    store.set(inkKey(s.seance), s.ink);
  }
  function askResume(deck, sc) {
    const e = sc.etat, faites = Object.keys(e.grade).length;
    app.innerHTML = `<div class="view end">
      <h2>On reprend, ${esc(user)} ?</h2>
      <p class="score">Tu en étais à <b>${faites}</b> sur ${e.order.length}${e.round > 1 ? ` (tour ${e.round})` : ""} dans « ${esc(deck.titre)} ».</p>
      <div class="actions"><button class="big g" id="resume">Reprendre</button><button class="big retry" id="restart">Tout recommencer</button></div>
    </div>`;
    document.getElementById("resume").onclick = () => resume(deck, sc);
    document.getElementById("restart").onclick = () => { sc.fin = new Date().toISOString(); sc.abandon = true; saveSeance(user, sc); store.set(inkKey(sc), null); deck.bilan ? choixBilan(deck) : start(deck, deck.cartes.map((_, i) => i)); };
  }
  function resume(deck, sc) {
    keepAwake();
    const e = sc.etat;
    const s = { deck, indices: e.indices, total: e.indices.length, partial: e.indices.length !== deck.cartes.length, round: e.round, first: e.first || {}, streak: e.streak || 0, best: 0, seance: sc };
    s.order = e.order; s.grade = e.grade || {}; s.saisie = e.saisie || {}; s.shown = e.shown || {}; s.pick = e.pick || {}; s.auto = {}; s.essais = e.essais || {}; s.brouillon = e.brouillon || {};
    s.ink = store.get(inkKey(sc)) || {};
    const next = s.order.findIndex(i => s.grade[i] == null);
    s.pos = next >= 0 ? next : Math.min(e.pos || 0, s.order.length - 1);
    card(s);
  }
  function start(deck, indices) {
    keepAwake();
    const s = { deck, indices: indices.slice(), total: indices.length, partial: indices.length !== deck.cartes.length, round: 1, first: {}, streak: 0, best: 0 };
    s.seance = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), debut: new Date().toISOString(), paquet: deck.id, titre: deck.titre, cartes: indices.length, reponses: [] };
    newRound(s, indices);
    card(s);
  }
  function newRound(s, order) { s.order = order.slice(); s.pos = 0; s.grade = {}; s.ink = {}; s.shown = {}; s.pick = {}; s.saisie = {}; s.auto = {}; s.essais = {}; s.brouillon = {}; }

  function card(s) {
    const idx = s.order[s.pos];
    const c = s.deck.cartes[idx];
    const g = s.grade[idx];
    const shown = s.shown[idx] || g != null;
    const sues = s.order.filter(i => s.grade[i] === 2).length;
    const dots = s.order.map((i, k) => {
      const st = s.grade[i] === 2 ? "ok" : s.grade[i] === 1 ? "mid" : s.grade[i] === 0 ? "bad" : "";
      return `<button class="dot ${st} ${k === s.pos ? "cur" : ""}" data-k="${k}" aria-label="Carte ${k + 1}">${k + 1}</button>`;
    }).join("");
    const gradeBtn = (v, cls, label) => `<button class="big ${cls} ${g === v ? "picked" : ""}" data-v="${v}">${label}</button>`;
    closeCours();
    const topbar = `<div class="topbar">
        <button class="back" id="quit">← Mes leçons</button>
        <div class="progress">
          <div class="txt"><span>${esc(s.deck.titre)}${s.round > 1 ? ` · tour ${s.round}` : ""}</span><span>Carte ${s.pos + 1}/${s.order.length} · ${sues} sue${sues > 1 ? "s" : ""}</span></div>
          <div class="dots" id="dots">${dots}</div>
        </div>
      </div>`;
    const navBind = go => {
      document.getElementById("quit").onclick = () => { closeCours(); keep(s); back(); };
      document.getElementById("prev").onclick = () => s.pos > 0 && go(s.pos - 1);
      document.getElementById("next").onclick = () => s.pos < s.order.length - 1 && go(s.pos + 1);
      document.querySelectorAll("#dots .dot").forEach(b => b.onclick = () => go(+b.dataset.k));
      document.querySelector("#dots .cur")?.scrollIntoView({ block: "nearest", inline: "center" });
      document.getElementById("coursbtn")?.addEventListener("click", () => openCours(s.deck, c.cours));
    };
    const coursBtn = c.cours && s.deck.cours?.[c.cours] ? '<button class="coursebtn" id="coursbtn">📖 Revoir le cours</button>' : "";

    // Questionnaire (QCM) : c'est l'app qui corrige.
    if (c.qcm) {
      s.pick ||= {};
      const picked = s.pick[idx];
      const answered = picked != null;
      const ok = picked === c.bon;
      app.innerHTML = `<div class="view">
        ${topbar}
        <div class="question"><div class="qhead"><small>Questionnaire · avant les exercices</small>${coursBtn}</div><p>${esc(c.q)}</p></div>
        <div class="choices">
          ${c.choix.map((x, k) => `<button class="choice ${answered && k === c.bon ? "right" : ""} ${answered && k === picked && !ok ? "wrong" : ""}" data-k="${k}" ${answered ? "disabled" : ""}>${esc(x)}</button>`).join("")}
          ${answered ? `<div class="verdict ${ok ? "ok" : "ko"}"><b>${ok ? pick([`Bravo ${esc(user)} !`, "C'est juste !", "Exactement !"]) : "Pas tout à fait."}</b>${esc(c.explication || "")}</div>` : ""}
        </div>
        <div class="actions">
          <button class="nav" id="prev" ${s.pos === 0 ? "disabled" : ""} aria-label="Question précédente">←</button>
          <div class="main" id="main">${answered ? `<button class="big retry" id="retry">Réessayer</button><button class="big ${ok ? "g" : "reveal"}" id="cont">Continuer</button>` : ""}</div>
          <button class="nav" id="next" ${s.pos === s.order.length - 1 ? "disabled" : ""} aria-label="Question suivante">→</button>
        </div>
      </div>`;
      navBind(k => { s.pos = k; keep(s); card(s); });
      document.querySelectorAll(".choice[data-k]").forEach(b => b.onclick = () => {
        s.pick[idx] = +b.dataset.k; card(s);
        if (+b.dataset.k !== c.bon && c.cours) openCours(s.deck, c.cours);
      });
      if (answered) {
        document.getElementById("cont").onclick = () => { closeCours(); grade(s, idx, ok ? 2 : 0, { auto: true }); };
        document.getElementById("retry").onclick = () => { closeCours(); delete s.pick[idx]; delete s.grade[idx]; keep(s); card(s); };
      }
      return;
    }
    const posee = c.op ? poseHtml(c.op, c.nombres, true) : null;
    // Correction automatique : résultat (maths), mot (dictée) ou réponse d'un exercice à trou (leçon),
    // écrit au crayon dans la case, l'iPad le convertit en texte.
    const trou = c.rep != null;
    const bilan = !!s.deck.bilan;
    const attendu = posee ? posee.r : bilan ? c.phrase : c.mot != null ? c.mot : trou ? c.rep : null;
    const saisi = s.saisie[idx];
    const verdict = saisi != null ? (posee ? checkNombre(saisi, attendu) : bilan ? checkPhrase(saisi, attendu) : checkRep(saisi, attendu)) : null;
    s.essais ||= {}; s.brouillon ||= {};
    const essais = s.essais[idx] || 0, brouillon = s.brouillon[idx];
    const dic = !!s.deck.dictee;
    // Dictée et exercice à trou : la grande ligne au milieu, sans feuille de brouillon.
    // Paquet « crayon » (ex. CE1) : pas de Griffonner, l'enfant écrit librement sur la feuille et se corrige seule.
    // Problème (brouillon) : feuille pour chercher, et la réponse dans une petite case en dessous.
    const grand = (dic || trou) && !s.deck.crayon && !c.brouillon;
    // La ligne de cahier : grande au centre pour la dictée, plus courte sous la feuille pour le résultat des maths.
    // Après « Vérifier », la dictée garde le mot écrit, en lecture seule.
    const ligneHtml = grand => `<form class="ligne" id="saisie">
        <div class="seyes${grand ? "" : " court"}"><div class="ecrit" id="rep" role="textbox" aria-label="${posee ? "Résultat" : trou ? "La réponse" : "Le mot"}"
          ${posee ? 'inputmode="decimal"' : ""} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          data-ph="${trou ? "Écris ta réponse ici, au crayon" : bilan ? "Écris la phrase ici, au crayon" : grand ? "Écris le mot ici, au crayon" : "Écris le résultat ici"}" ${shown ? 'contenteditable="false"' : 'data-edit="1"'}>${shown ? esc(saisi || "") : bilan && brouillon ? esc(brouillon) : ""}</div><div class="ecrit probe" aria-hidden="true">Hg<i></i></div></div>
        <div class="ligne-actions">${shown || posee ? "" : '<div class="outils"><button type="button" class="tool" id="apos" aria-label="Apostrophe">’</button><button type="button" class="tool" id="bksp">⌫ Une lettre</button><button type="button" class="tool" id="wipe">Tout effacer</button></div>'}
        ${shown ? "" : '<button class="big g" type="submit">Vérifier</button>'}</div>
      </form>`;
    // Dictée et exercice à trou : c'est juste ou à revoir, pas de « presque ».
    const grades = () => grand || dic || trou
      ? gradeBtn(0, "b", "À revoir") + gradeBtn(2, "g", "C'est juste !")
      : gradeBtn(0, "b", "À revoir") + gradeBtn(1, "m", "Presque") + gradeBtn(2, "g", "Je savais !");
    const questionHtml = bilan
      ? `<div class="question"><small>Dictée bilan · groupe ${esc(c.groupe)}</small><p>Écoute bien la phrase, puis écris-la.</p>
          <div class="listen"><button class="say" id="say">🔊 Écouter</button></div>
          ${essais && !shown ? `<p class="essai">C'est faux, cherche ! Essai ${essais + 1} sur 3${s.essaiMsg ? " · " + esc(s.essaiMsg) : ""}</p>` : ""}</div>`
      : dic
      ? `<div class="question"><small>Dictée · mot ${s.pos + 1}</small><p>Écoute bien, puis écris le mot.</p>
          <div class="listen"><button class="say" id="say">🔊 Écouter</button>${c.phrase ? '<button class="say alt" id="sayphrase">Une phrase d\'exemple</button>' : ""}</div></div>`
      : trou
      ? `<div class="question"><div class="qhead"><small>${c.brouillon ? "Problème · cherche sur la feuille, puis écris la réponse dans la case" : "Exercice · écris la réponse dans la case"}</small>${coursBtn}</div><p>${esc(c.q)}</p></div>`
      : posee
      ? `<div class="question"><div class="qhead"><small>Exercice · pose l'opération sur la feuille</small>${coursBtn}</div><p>${esc(c.q || "Pose et calcule :")} ${esc(c.nombres.join(" " + c.op + " "))}</p></div>`
      : `<div class="question"><div class="qhead"><small>${c.points ? "Question longue" : "Question"}</small>${coursBtn}</div><p>${esc(c.q)}</p></div>`;
    const answerHtml = bilan
      ? `${verdictHtml(verdict, saisi)}<small>La phrase</small><p class="r">${esc(c.phrase)}</p>`
      : dic
      ? `${verdictHtml(verdict, saisi)}<small>Le mot</small><p class="r">${esc(c.mot)}</p>`
      : trou
      ? `${verdictHtml(verdict, saisi)}<small>La réponse</small><p class="r">${esc(c.r || [].concat(c.rep)[0])}</p>`
      : posee
      ? `${verdictHtml(verdict, saisi)}<small>L'opération posée</small>${posee.html}<p class="r">${esc(c.nombres.join(" " + c.op + " "))} = ${esc(posee.r)}</p>`
      : `<small>La réponse</small>
          <p class="r">${esc(c.r)}</p>
          ${c.points ? `<ul id="pts">${c.points.map(p => `<li><button><span class="box">✓</span><span>${esc(p)}</span></button></li>`).join("")}</ul>` : ""}`;
    app.innerHTML = `<div class="view">
      ${topbar}
      ${questionHtml}
      <div class="sheet${grand ? " dictee" : ""}${bilan ? " bilan" : ""}" id="sheet">
        ${grand ? ligneHtml(true) : `<canvas id="cv"></canvas>
        <span class="placeholder" id="ph">Écris ta réponse ici…</span>
        <div class="tools">
          <button class="tool" id="undo">Annuler</button>
          <button class="tool" id="clear">Tout effacer</button>
        </div>`}
        <div class="answer${verdict && !verdict.ok ? " ko" : ""}" id="ans" ${shown ? "" : "hidden"}>
          <button class="fold" id="fold">Voir ma feuille ▾</button>
          ${answerHtml}
        </div>
      </div>
      ${(posee || (trou && c.brouillon)) && !shown ? ligneHtml(false) : ""}
      <div class="actions" id="act">
        <button class="nav" id="prev" ${s.pos === 0 ? "disabled" : ""} aria-label="Question précédente">←</button>
        <div class="main" id="main">${shown && verdict
          ? `<button class="big retry" id="retry">Réessayer</button><button class="big ${verdict.ok ? "g" : "reveal"}" id="cont">Continuer</button>`
          : shown
          ? `<button class="big retry" id="retry">Réessayer</button>` + grades()
          : bilan ? "" : `<button class="big reveal" id="show">${dic ? "Voir le mot" : "Voir la réponse"}</button>`}</div>
        <button class="nav" id="next" ${s.pos === s.order.length - 1 ? "disabled" : ""} aria-label="Question suivante">→</button>
      </div>
    </div>`;
    const ed = document.querySelector('#rep[data-edit]');
    if (ed) {
      // Boutons sous la case : Griffonner perd parfois l'apostrophe et efface un mot entier quand on barre une lettre.
      const caret = () => { const sel = getSelection(); return sel.rangeCount && ed.contains(sel.anchorNode) && sel.isCollapsed ? sel : null; };
      const edit = fn => { const t = ed.textContent, sel = caret(); let pos = t.length;
        if (sel && sel.anchorNode.nodeType === 3) { const r = document.createRange(); r.setStart(ed, 0); r.setEnd(sel.anchorNode, sel.anchorOffset); pos = r.toString().length; }
        const [nt, np] = fn(t, pos); ed.textContent = nt;
        if (ed.firstChild) { const r = document.createRange(); r.setStart(ed.firstChild, Math.min(np, nt.length)); r.collapse(true); const g = getSelection(); g.removeAllRanges(); g.addRange(r); } };
      document.getElementById("apos")?.addEventListener("click", () => edit((t, p) => [t.slice(0, p) + "'" + t.slice(p), p + 1]));
      document.getElementById("bksp")?.addEventListener("click", () => edit((t, p) => p ? [t.slice(0, p - 1) + t.slice(p), p - 1] : [t, 0]));
      document.getElementById("wipe")?.addEventListener("click", () => { ed.textContent = ""; });
      ["apos", "bksp", "wipe"].forEach(id => document.getElementById(id)?.addEventListener("pointerdown", e => e.preventDefault()));
      try { ed.contentEditable = "plaintext-only"; } catch (e) {}
      if (ed.contentEditable !== "plaintext-only") ed.contentEditable = "true";
      ed.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("saisie").requestSubmit(); } });
      ed.addEventListener("input", () => { if (!ed.textContent.trim()) ed.textContent = ""; });
    }
    alignLigne(); document.fonts?.ready.then(alignLigne);
    s.ink[idx] ||= [];
    const pad = grand ? { stop() {}, undo() {}, clear() {} } : drawPad(document.getElementById("cv"), document.getElementById("ph"), s.ink[idx]);
    const go = k => { pad.stop(); voice.stop(); s.pos = k; keep(s); card(s); };
    document.getElementById("undo")?.addEventListener("click", pad.undo);
    document.getElementById("clear")?.addEventListener("click", pad.clear);
    navBind(go);
    document.getElementById("quit").onclick = () => { pad.stop(); voice.stop(); closeCours(); keep(s); back(); };
    if (dic) {
      document.getElementById("say").onclick = () => dictate(c);
      if (c.phrase && !bilan) document.getElementById("sayphrase").onclick = () => sayPhrase(c);
      // Le mot est dit tout seul en arrivant sur une carte pas encore vue (l'iPad l'autorise après le premier toucher).
      if (!shown && !(bilan && essais)) dictate(c);
    }
    const bindPoints = () => document.querySelectorAll("#pts li button").forEach(b => b.onclick = () => b.parentElement.classList.toggle("on"));
